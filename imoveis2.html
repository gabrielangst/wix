<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Visitas - Imóveis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        /* Telas */
        #app-screen { display: none; }
        #login-screen {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover { background: #0056b3; }
        
        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-actions {
            display: flex;
            gap: 10px;
        }
        .btn-incluir { background: #28a745; padding: 10px 20px; width: auto; font-weight: bold; }
        .btn-incluir:hover { background: #218838; }
        .btn-logout { background: #6c757d; padding: 10px 20px; width: auto; }
        .btn-logout:hover { background: #5a6268; }

        /* Modal */
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5em;
            cursor: pointer;
            color: #888;
        }
        .close-btn:hover { color: #333; }
        #btn-salvar-modal { background: #28a745; margin-top: 10px; font-weight: bold; }
        #btn-salvar-modal:hover { background: #218838; }

        /* Cards */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card-content { padding: 10px 0; flex-grow: 1; }
        
        /* Cabeçalho do Card (Título + Estrela) */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 5px;
        }
        .card-header h3 { margin: 0; font-size: 1.2em; }
        .star-btn {
            cursor: pointer;
            font-size: 1.5em;
            user-select: none;
            transition: transform 0.2s;
        }
        .star-btn:hover { transform: scale(1.2); }

        .price { color: #27ae60; font-weight: bold; font-size: 1.1em; margin-bottom: 10px; }
        .btn-link {
            display: block; text-align: center; background: #007bff;
            color: white; text-decoration: none; padding: 10px;
            border-radius: 5px; margin-bottom: 10px;
        }
        .btn-link:hover { background: #0056b3; }
        
        .notes-area {
            width: 100%; border: 1px solid #ddd; border-radius: 5px;
            padding: 8px; font-family: inherit; font-size: 0.9em;
            resize: none; box-sizing: border-box;
            background-color: #fff9e6; margin-bottom: 10px;
        }
        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-edit { background: #17a2b8; flex: 1; padding: 8px; font-size: 0.9em; }
        .btn-edit:hover { background: #138496; }
        .btn-delete { background: #dc3545; flex: 1; padding: 8px; font-size: 0.9em; }
        .btn-delete:hover { background: #c82333; }
        
        /* Botões de Ordenação */
        .btn-up, .btn-down { background: #6c757d; flex: 0.3; padding: 8px; font-size: 1.1em; }
        .btn-up:hover, .btn-down:hover { background: #5a6268; }
        
        .divisor { max-width: 1200px; margin: 40px auto; border: 0; border-top: 2px solid #ddd; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Entrar no Sistema</h2>
        <input type="email" id="email" placeholder="Seu E-mail">
        <input type="password" id="senha" placeholder="Sua Senha">
        <button id="btn-login">Entrar</button>
        <p id="login-erro" style="color: red; display: none; margin-top: 10px;">Erro ao fazer login.</p>
    </div>

    <div id="app-screen">
        <div class="top-bar">
            <h1>Imóveis Selecionados</h1>
            <div class="top-actions">
                <button id="btn-abrir-incluir" class="btn-incluir">+ Incluir Imóvel</button>
                <button id="btn-logout" class="btn-logout">Sair</button>
            </div>
        </div>

        <h2>⭐ Imóveis Preferenciais</h2>
        <div class="container" id="lista-preferenciais"></div>

        <hr class="divisor">

        <h2>Outros Imóveis</h2>
        <div class="container" id="lista-outros"></div>
    </div>

    <!-- Modal Único para Adicionar/Editar -->
    <div id="modal-imovel" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" id="btn-fechar-modal">&times;</span>
            <h2 id="modal-titulo-texto">Adicionar Imóvel</h2>
            
            <input type="hidden" id="modal-id"> 
            
            <input type="text" id="modal-titulo" placeholder="Nome (Ex: Jardins do Lago Q9)">
            <input type="number" id="modal-preco" placeholder="Preço (Ex: 2500000)">
            <select id="modal-status">
                <option value="outros" selected>Outros</option>
                <option value="preferencial">⭐ Preferencial</option>
            </select>
            <input type="url" id="modal-imagem" placeholder="URL da Imagem">
            <input type="url" id="modal-link" placeholder="Link do Anúncio">
            <textarea id="modal-anotacao" placeholder="Anotações sobre a negociação..." rows="4"></textarea>
            
            <button id="btn-salvar-modal">Salvar Imóvel</button>
        </div>
    </div>

    <!-- Script de Integração com Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getDatabase, ref, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdrKX1kkYmWp8Vb1M8eX3nqaHnvFZ4afk",
            authDomain: "imoveis-39378.firebaseapp.com",
            projectId: "imoveis-39378",
            storageBucket: "imoveis-39378.firebasestorage.app",
            messagingSenderId: "239923130312",
            appId: "1:239923130312:web:5f926ef4fbfe0224529afd",
            databaseURL: "https://imoveis-39378-default-rtdb.firebaseio.com" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const listaPreferenciais = document.getElementById('lista-preferenciais');
        const listaOutros = document.getElementById('lista-outros');
        
        const modal = document.getElementById('modal-imovel');
        const tituloTexto = document.getElementById('modal-titulo-texto');
        const inputId = document.getElementById('modal-id');
        const inputTitulo = document.getElementById('modal-titulo');
        const inputPreco = document.getElementById('modal-preco');
        const inputStatus = document.getElementById('modal-status');
        const inputImagem = document.getElementById('modal-imagem');
        const inputLink = document.getElementById('modal-link');
        const inputAnotacao = document.getElementById('modal-anotacao');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginScreen.style.display = 'none';
                appScreen.style.display = 'block';
                carregarImoveis();
            } else {
                loginScreen.style.display = 'block';
                appScreen.style.display = 'none';
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('senha').value)
                .catch(() => document.getElementById('login-erro').style.display = 'block');
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        function abrirModal(modo, id = null) {
            modal.style.display = 'flex'; 
            if (modo === 'incluir') {
                tituloTexto.innerText = 'Adicionar Novo Imóvel';
                inputId.value = ''; 
                inputTitulo.value = '';
                inputPreco.value = '';
                inputStatus.value = 'outros'; 
                inputImagem.value = '';
                inputLink.value = '';
                inputAnotacao.value = '';
            } else if (modo === 'editar' && id) {
                tituloTexto.innerText = 'Editar Imóvel';
                inputId.value = id; 
                get(ref(db, `imoveis/${id}`)).then((snapshot) => {
                    if (snapshot.exists()) {
                        const dados = snapshot.val();
                        inputTitulo.value = dados.titulo || '';
                        inputPreco.value = dados.preco || '';
                        inputStatus.value = dados.status || 'outros';
                        inputImagem.value = dados.imagem || '';
                        inputLink.value = dados.link || '';
                        inputAnotacao.value = dados.anotacoes || '';
                    }
                });
            }
        }

        function fecharModal() { modal.style.display = 'none'; }
        document.getElementById('btn-abrir-incluir').addEventListener('click', () => abrirModal('incluir'));
        document.getElementById('btn-fechar-modal').addEventListener('click', fecharModal);
        window.addEventListener('click', (e) => { if (e.target === modal) fecharModal(); });

        const formatarPreco = (valor) => Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        function carregarImoveis() {
            onValue(ref(db, 'imoveis'), (snapshot) => {
                listaPreferenciais.innerHTML = '';
                listaOutros.innerHTML = '';

                let prefs = [];
                let outros = [];

                snapshot.forEach((childSnapshot) => {
                    const item = childSnapshot.val();
                    item.id = childSnapshot.key;
                    // Se não tiver ordem salva (imóveis antigos), usa o Timestamp para jogar pro final
                    item.ordem = item.ordem !== undefined ? item.ordem : Date.now();
                    
                    if (item.status === 'preferencial') prefs.push(item);
                    else outros.push(item);
                });

                // Ordena os arrays baseado na numeração
                prefs.sort((a, b) => a.ordem - b.ordem);
                outros.sort((a, b) => a.ordem - b.ordem);

                // Guarda globalmente para a função de reordenar usar
                window.imoveisData = { preferencial: prefs, outros: outros };

                const renderCard = (imovel, container) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${imovel.imagem}" alt="Foto da Casa" onerror="this.src='https://via.placeholder.com/400x200?text=Sem+Imagem'">
                        <div class="card-content">
                            <div class="card-header">
                                <h3>${imovel.titulo}</h3>
                                <span class="star-btn" data-id="${imovel.id}" data-atual="${imovel.status}" title="Mover categoria">
                                    ${imovel.status === 'preferencial' ? '⭐' : '☆'}
                                </span>
                            </div>
                            <p class="price">${formatarPreco(imovel.preco)}</p>
                            <a href="${imovel.link}" class="btn-link" target="_blank">Ver Anúncio</a>
                        </div>
                        <textarea class="notes-area" rows="3" data-id="${imovel.id}" placeholder="Escreva suas anotações...">${imovel.anotacoes || ''}</textarea>
                        <div class="card-actions">
                            <button class="btn-up" data-id="${imovel.id}" data-status="${imovel.status}" title="Mover para cima">⬆️</button>
                            <button class="btn-down" data-id="${imovel.id}" data-status="${imovel.status}" title="Mover para baixo">⬇️</button>
                            <button class="btn-edit" data-id="${imovel.id}">Editar</button>
                            <button class="btn-delete" data-id="${imovel.id}">Excluir</button>
                        </div>
                    `;
                    container.appendChild(card);
                };

                prefs.forEach(imovel => renderCard(imovel, listaPreferenciais));
                outros.forEach(imovel => renderCard(imovel, listaOutros));
            });
        }

        document.getElementById('btn-salvar-modal').addEventListener('click', () => {
            const id = inputId.value; 
            const dadosImovel = {
                titulo: inputTitulo.value,
                preco: inputPreco.value,
                status: inputStatus.value,
                imagem: inputImagem.value,
                link: inputLink.value,
                anotacoes: inputAnotacao.value,
                ordem: Date.now() // Garante que novos imóveis vão para o final da lista
            };

            if (!dadosImovel.titulo || !dadosImovel.preco) {
                alert("Preencha ao menos o Título e o Preço.");
                return;
            }

            if (id) update(ref(db, `imoveis/${id}`), dadosImovel).then(fecharModal);
            else push(ref(db, 'imoveis'), dadosImovel).then(fecharModal);
        });

        // Delegação Geral de Cliques (Deletar, Estrela de Categoria e Reordenar)
        document.addEventListener('click', (e) => {
            // Excluir
            if (e.target.classList.contains('btn-delete')) {
                if (confirm('Tem certeza que deseja excluir este imóvel?')) {
                    remove(ref(db, `imoveis/${e.target.getAttribute('data-id')}`));
                }
            }
            
            // Editar Modal
            if (e.target.classList.contains('btn-edit')) {
                abrirModal('editar', e.target.getAttribute('data-id'));
            }

            // Mover Categoria (Estrela)
            if (e.target.classList.contains('star-btn')) {
                const id = e.target.getAttribute('data-id');
                const novoStatus = e.target.getAttribute('data-atual') === 'preferencial' ? 'outros' : 'preferencial';
                // Move para a nova categoria jogando pro final dela
                update(ref(db, `imoveis/${id}`), { status: novoStatus, ordem: Date.now() });
            }

            // Reordenar (Setas)
            const isUp = e.target.classList.contains('btn-up');
            const isDown = e.target.classList.contains('btn-down');
            if (isUp || isDown) {
                const id = e.target.getAttribute('data-id');
                const status = e.target.getAttribute('data-status');
                
                // Puxa a lista global salva na leitura
                let lista = window.imoveisData[status];
                const index = lista.findIndex(i => i.id === id);
                
                // Lógica para inverter as posições na lista local
                if (isUp && index > 0) {
                    const temp = lista[index];
                    lista[index] = lista[index - 1];
                    lista[index - 1] = temp;
                } else if (isDown && index < lista.length - 1) {
                    const temp = lista[index];
                    lista[index] = lista[index + 1];
                    lista[index + 1] = temp;
                } else {
                    return; // Já está no limite, não faz nada
                }

                // Salva a nova ordem de todos os cards dessa categoria no Firebase de uma só vez
                const updates = {};
                lista.forEach((item, idx) => {
                    updates[`imoveis/${item.id}/ordem`] = idx;
                });
                update(ref(db), updates);
            }
        });

        // Salvar anotação rápida
        document.addEventListener('focusout', (e) => {
            if (e.target.classList.contains('notes-area')) {
                update(ref(db, `imoveis/${e.target.getAttribute('data-id')}`), { anotacoes: e.target.value });
            }
        });
    </script>
</body>
</html>
