<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasília Travel Guide - English Version</title>
    <style>
        :root {
            --bsb-sky: #00AEEF;
            --bsb-text: #333333;
        }
        
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            color: var(--bsb-text);
            background-color: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 0;
        }

        .container {
            background-color: white;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .logo-img {
            width: 180px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--bsb-text);
            line-height: 1.2;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }

        .book-cover {
            width: 200px;
            height: 280px;
            background-color: #ddd;
            object-fit: cover;
            box-shadow: 5px 10px 25px rgba(0,0,0,0.15);
            border-radius: 6px;
            margin-bottom: 30px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .btn-primary {
            background-color: var(--bsb-sky);
            color: white;
            border: 2px solid var(--bsb-sky);
        }

        .btn-primary:hover {
            background-color: #008cbf;
            border-color: #008cbf;
            box-shadow: 0 4px 10px rgba(0, 174, 239, 0.3);
        }

        .btn-outline {
            border: 2px solid var(--bsb-sky);
            color: var(--bsb-sky);
            background-color: transparent;
        }

        .btn-outline:hover {
            background-color: var(--bsb-sky);
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="../guiadebrasilia/index.html">
            <img src="../guiadebrasilia/logo_index.png" alt="Guia de Brasília Logo" class="logo-img">
        </a>
        
        <h1>Brasília Travel Guide</h1>
        <p>Welcome! Choose an option below to access the English version.</p>
        
        <img src="../guiadebrasilia/Capa_Livro.jpg" alt="Brasília Travel Guide Cover" class="book-cover">
        
        <a href="../guiadebrasilia/livros_pdf/Brasilia_Travel_Guide.pdf" class="btn btn-primary" target="_blank" download>Download Free PDF</a>
        <a href="https://clubedeautores.com.br/livro/brasilia-travel-guide" class="btn btn-outline" target="_blank">Buy Physical Book</a>
        <a href="../guiadebrasilia/index.html" class="btn btn-outline">Visit Official Website</a>
    </div>

</body>
</html>
