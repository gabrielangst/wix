<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setlist Réveillon</title>
    <style>
        :root {
            --bg-color: #f4f6f8; 
            --surface: #ffffff; 
            --primary: #c5a028; 
            --text-main: #333333; 
            --text-muted: #777777; 
            --border: #dddddd; 
            --danger: #e74c3c;
            --radius: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 80px; }

        header {
            background-color: var(--surface);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
            position: sticky;
            top: 0;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        header h1 { color: var(--primary); font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        
        .auth-container { display: flex; align-items: center; gap: 10px; }
        .user-info { font-size: 0.9rem; color: var(--text-muted); display: none; }
        .auth-btn { background: var(--surface); color: var(--primary); border: 1px solid var(--primary); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; display: none; }
        .auth-btn:hover { background: var(--primary); color: #fff; }
        
        #app-content { display: none; }
        
        #auth-screen { max-width: 400px; margin: 60px auto; padding: 30px; background-color: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #auth-screen h2 { color: var(--primary); margin-bottom: 20px; }
        .auth-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .error-msg { color: var(--danger); font-size: 0.85rem; margin-top: 10px; min-height: 20px; }

        main { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* Song Card & Drag Drop */
        .song-card { background-color: var(--surface); border-radius: var(--radius); margin-bottom: 15px; border: 1px solid var(--border); overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.03); transition: transform 0.2s, box-shadow 0.2s; }
        .song-card.dragging { opacity: 0.6; box-shadow: 0 10px 20px rgba(0,0,0,0.1); border: 2px dashed var(--primary); }
        
        .song-header { padding: 15px; display: flex; justify-content: space-between; align-items: flex-start; cursor: pointer; }
        
        .drag-handle { color: #cccccc; font-size: 1.5rem; margin-right: 15px; display: flex; align-items: center; justify-content: center; user-select: none; cursor: grab; padding: 0 5px; }
        .drag-handle:active { cursor: grabbing; color: var(--primary); }
        .drag-handle:hover { color: var(--primary); }

        .song-info { flex: 1; }
        .song-info h2 { font-size: 1.2rem; margin-bottom: 4px; color: var(--text-main); display: flex; align-items: center; }
        .song-info p { color: var(--text-muted); font-size: 0.9rem; }
        
        .yt-icon { margin-right: 8px; display: flex; align-items: center; transition: transform 0.2s; }
        .yt-icon:hover { transform: scale(1.1); }

        .song-badges { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
        .badge { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; background: #eeeeee; padding: 3px 8px; border-radius: 12px; color: var(--text-muted); }
        .badge-link { cursor: pointer; color: var(--primary); background: #fdf5e6; text-decoration: none; border: 1px solid var(--primary); }
        .badge-link:hover { background: var(--primary); color: #fff; }

        .song-actions { display: flex; align-items: center; margin-left: 10px; margin-top: 2px; }
        .song-actions button { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 5px; margin-left: 5px; }
        .song-actions button.delete-btn:hover { color: var(--danger); }
        .song-actions button.edit-btn:hover { color: var(--primary); }

        .song-details { display: none; padding: 15px; border-top: 1px solid var(--border); background-color: #fdfdfd; }
        .song-card.expanded .song-details { display: block; }
        .details-section { margin-bottom: 15px; }
        .details-section h3 { color: var(--primary); font-size: 0.9rem; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .details-section pre { background-color: #f4f6f8; padding: 10px; border-radius: 4px; overflow-x: auto; font-family: monospace; white-space: pre-wrap; font-size: 0.9rem; color: #333; border: 1px solid var(--border); }

        .fab { position: fixed; bottom: 30px; right: 30px; background-color: var(--primary); color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; border: none; z-index: 100; }

        dialog { background-color: var(--surface); color: var(--text-main); border: 1px solid var(--primary); border-radius: var(--radius); padding: 20px; width: 90%; max-width: 500px; margin: auto; top: 50%; transform: translateY(-50%); box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        dialog::backdrop { background-color: rgba(0, 0, 0, 0.5); }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; text-align: left; }
        .form-group label { margin-bottom: 5px; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
        .form-group input, .form-group textarea { background-color: #ffffff; border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 4px; font-size: 1rem; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
        .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-cancel { background-color: transparent; color: var(--text-muted); border: 1px solid var(--border); }
        .btn-save { background-color: var(--primary); color: #fff; }
        .btn-secondary { background-color: var(--border); color: var(--text-main); }
        
        .loading { text-align: center; margin-top: 50px; color: var(--primary); display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Setlist Réveillon v1.0</h1>
        <div class="auth-container">
            <span class="user-info" id="userInfo"></span>
            <button class="auth-btn" id="logoutBtn">Sair</button>
        </div>
    </header>

    <div id="auth-screen">
        <h2>Acesso ao Setlist</h2>
        <div class="form-group"><input type="email" id="emailInput" placeholder="E-mail" required></div>
        <div class="form-group"><input type="password" id="passwordInput" placeholder="Senha" required></div>
        <div class="auth-buttons">
            <button id="loginBtn" class="btn btn-save">Entrar</button>
            <button id="registerBtn" class="btn btn-secondary" style="display: none;">Criar Conta</button>
        </div>
        <p id="authError" class="error-msg"></p>
    </div>

    <div id="app-content">
        <div class="loading" id="loadingState">Carregando dados...</div>
        <main id="setlist-container"></main>
        <button class="fab" onclick="ui.openModal()">+</button>
    </div>

    <dialog id="songModal">
        <h2 id="modalTitle" style="margin-bottom: 15px; color: var(--primary);">Nova Música</h2>
        <form id="songForm">
            <input type="hidden" id="songId">
            <div class="form-group">
                <label for="title">Título da Música *</label>
                <input type="text" id="title" required>
            </div>
            <div class="form-group">
                <label for="artist">Artista / Banda</label>
                <input type="text" id="artist">
            </div>
            <div class="form-group">
                <label for="linkRehearsal">Versão para ensaiar (Link YouTube)</label>
                <input type="url" id="linkRehearsal" placeholder="https://youtube.com/...">
            </div>
            <div class="form-group">
                <label for="notes">Anotações (Tom, BPM, estrutura...)</label>
                <textarea id="notes" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label for="linkGuitar">Link - Tutorial Violão/Guitarra</label>
                <input type="url" id="linkGuitar" placeholder="https://youtube.com/...">
            </div>
            <div class="form-group">
                <label for="linkDrums">Link - Tutorial Bateria</label>
                <input type="url" id="linkDrums" placeholder="https://youtube.com/...">
            </div>
            <div class="form-group">
                <label for="lyrics">Letra / Cifra</label>
                <textarea id="lyrics" rows="5"></textarea>
            </div>
            <div class="form-actions" style="width: auto;">
                <button type="button" class="btn btn-cancel" style="width: auto;" onclick="ui.closeModal()">Cancelar</button>
                <button type="submit" class="btn btn-save" style="width: auto;">Salvar</button>
            </div>
        </form>
    </dialog>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getDatabase, ref, push, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBoM04B-U8OLW85Q3PFyRvYMzv8mpvRj-g",
          authDomain: "setlist-show.firebaseapp.com",
          databaseURL: "https://setlist-show-default-rtdb.firebaseio.com",
          projectId: "setlist-show",
          storageBucket: "setlist-show.firebasestorage.app",
          messagingSenderId: "516147951376",
          appId: "1:516147951376:web:1b85b13a0a2cb9bc521795"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentSongs = [];
        let currentUser = null;

        class DatabaseService {
            constructor(db) { 
                this.db = db;
                this.basePath = 'setlist/songs'; 
            }

            listenToSongs(callback) {
                const songsRef = ref(this.db, this.basePath);
                onValue(songsRef, (snapshot) => {
                    const data = snapshot.val();
                    const songs = [];
                    if (data) {
                        for (const [id, songData] of Object.entries(data)) {
                            songs.push({ id, ...songData });
                        }
                    }
                    songs.sort((a, b) => (a.order || 0) - (b.order || 0));
                    callback(songs);
                });
            }

            async addSong(songData) {
                const songsRef = ref(this.db, this.basePath);
                await push(songsRef, songData);
            }

            async updateSong(id, songData) {
                const songRef = ref(this.db, `${this.basePath}/${id}`);
                await update(songRef, songData);
            }

            async deleteSong(id) {
                const songRef = ref(this.db, `${this.basePath}/${id}`);
                await remove(songRef);
            }

            async updateMultiple(updates) {
                const basePathRef = ref(this.db, this.basePath);
                await update(basePathRef, updates);
            }
        }

        class UIController {
            constructor(dbService) {
                this.dbService = dbService;
                this.container = document.getElementById('setlist-container');
                this.modal = document.getElementById('songModal');
                this.form = document.getElementById('songForm');
                
                this.youtubeIcon = `<svg viewBox="0 0 24 24" fill="#ff0000" width="24" height="24"><path d="M19.615 3.184c-3.604-.246-11.631-.245-15.23 0-3.897.266-4.356 2.62-4.385 8.816.029 6.185.484 8.549 4.385 8.816 3.6.245 11.626.246 15.23 0 3.897-.266 4.356-2.62 4.385-8.816-.029-6.185-.484-8.549-4.385-8.816zm-10.615 12.816v-8l8 3.993-8 4.007z"/></svg>`;
                
                this.setupEventListeners();
                this.setupDragAndDrop();
            }

            setupEventListeners() {
                this.form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!currentUser) return;
                    await this.handleFormSubmit();
                });
            }

            setupDragAndDrop() {
                this.container.addEventListener('dragover', e => {
                    e.preventDefault();
                    const afterElement = this.getDragAfterElement(this.container, e.clientY);
                    const draggable = document.querySelector('.dragging');
                    if (draggable) {
                        if (afterElement == null) {
                            this.container.appendChild(draggable);
                        } else {
                            this.container.insertBefore(draggable, afterElement);
                        }
                    }
                });

                this.container.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    const cards = [...this.container.querySelectorAll('.song-card')];
                    const updates = {};
                    let hasChanges = false;

                    cards.forEach((card, index) => {
                        const songId = card.dataset.id;
                        const song = currentSongs.find(s => s.id === songId);
                        if (song && song.order !== index) {
                            updates[`${songId}/order`] = index;
                            hasChanges = true;
                        }
                    });

                    if (hasChanges) {
                        await this.dbService.updateMultiple(updates);
                    }
                });
            }

            getDragAfterElement(container, y) {
                const draggableElements = [...container.querySelectorAll('.song-card:not(.dragging)')];
                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }

            renderSetlist(songs) {
                currentSongs = songs;
                this.container.innerHTML = '';
                document.getElementById('loadingState').style.display = 'none';

                if (songs.length === 0) {
                    this.container.innerHTML = '<p style="text-align:center; color:var(--text-muted); margin-top:50px;">O setlist está vazio. Adicione a primeira música!</p>';
                    return;
                }

                songs.forEach((song, index) => {
                    const card = document.createElement('div');
                    card.className = 'song-card';
                    card.dataset.id = song.id;
                    
                    let badgesHtml = '<div class="song-badges">';
                    if (song.notes) badgesHtml += '<span class="badge" title="Possui anotações">📝 Notas</span>';
                    if (song.lyrics) badgesHtml += '<span class="badge" title="Possui cifra/letra">📄 Cifra</span>';
                    if (song.linkGuitar) badgesHtml += `<a href="${song.linkGuitar}" target="_blank" class="badge badge-link" onclick="event.stopPropagation()">🎸 Violão</a>`;
                    if (song.linkDrums) badgesHtml += `<a href="${song.linkDrums}" target="_blank" class="badge badge-link" onclick="event.stopPropagation()">🥁 Bateria</a>`;
                    badgesHtml += '</div>';

                    let titleHtml = '';
                    if (song.linkRehearsal) {
                        titleHtml += `<a href="${song.linkRehearsal}" target="_blank" class="yt-icon" onclick="event.stopPropagation()" title="Versão para ensaiar">${this.youtubeIcon}</a>`;
                    }
                    titleHtml += `<span>${index + 1}. ${song.title}</span>`;

                    card.innerHTML = `
                        <div class="song-header">
                            <div class="drag-handle" title="Arraste para reordenar">☰</div>
                            <div class="song-info">
                                <h2>${titleHtml}</h2>
                                <p>${song.artist || 'Artista desconhecido'}</p>
                                ${badgesHtml}
                            </div>
                            <div class="song-actions">
                                <button class="edit-btn" onclick="event.stopPropagation(); window.ui.editSong('${song.id}')" title="Editar">✎</button>
                                <button class="delete-btn" onclick="event.stopPropagation(); window.ui.deleteSong('${song.id}')" title="Excluir">✖</button>
                            </div>
                        </div>
                        <div class="song-details">
                            ${song.notes ? `<div class="details-section"><h3>Anotações</h3><p>${song.notes}</p></div>` : ''}
                            ${song.lyrics ? `<div class="details-section"><h3>Letra / Cifra</h3><pre>${song.lyrics}</pre></div>` : ''}
                        </div>
                    `;

                    // Lógica para Drag and Drop pelo ícone ☰
                    const dragHandle = card.querySelector('.drag-handle');
                    
                    dragHandle.addEventListener('mousedown', () => card.draggable = true);
                    dragHandle.addEventListener('touchstart', () => card.draggable = true, { passive: true });
                    
                    card.addEventListener('dragstart', (e) => {
                        card.classList.add('dragging');
                        // Necessário para o drag funcionar bem no Firefox
                        if (e.dataTransfer) e.dataTransfer.setData('text/plain', song.id); 
                    });
                    
                    card.addEventListener('dragend', () => {
                        card.classList.remove('dragging');
                        card.draggable = false;
                    });

                    // Inteligência do Accordion (Header) para não atrapalhar seleção de texto
                    const header = card.querySelector('.song-header');
                    header.addEventListener('click', (e) => {
                        // Se há texto selecionado, não faz nada (permite copiar)
                        if (window.getSelection().toString().length > 0) return;
                        
                        // Não expande se o usuário clicou nos botões, ícones ou no arrastador
                        if (e.target.closest('.song-actions') || 
                            e.target.closest('.yt-icon') || 
                            e.target.closest('.drag-handle') ||
                            e.target.closest('.badge-link')) {
                            return;
                        }

                        card.classList.toggle('expanded');
                    });

                    this.container.appendChild(card);
                });
            }

            openModal() {
                this.form.reset();
                document.getElementById('songId').value = '';
                document.getElementById('modalTitle').textContent = 'Nova Música';
                this.modal.showModal();
            }

            closeModal() {
                this.modal.close();
                this.form.reset();
            }

            async handleFormSubmit() {
                const id = document.getElementById('songId').value;
                const songData = {
                    title: document.getElementById('title').value,
                    artist: document.getElementById('artist').value,
                    linkRehearsal: document.getElementById('linkRehearsal').value,
                    notes: document.getElementById('notes').value,
                    linkGuitar: document.getElementById('linkGuitar').value,
                    linkDrums: document.getElementById('linkDrums').value,
                    lyrics: document.getElementById('lyrics').value
                };

                if (id) {
                    await this.dbService.updateSong(id, songData);
                } else {
                    songData.order = currentSongs.length;
                    await this.dbService.addSong(songData);
                }
                this.closeModal();
            }

            editSong(id) {
                const song = currentSongs.find(s => s.id === id);
                if (!song) return;

                document.getElementById('songId').value = song.id;
                document.getElementById('title').value = song.title;
                document.getElementById('artist').value = song.artist || '';
                document.getElementById('linkRehearsal').value = song.linkRehearsal || '';
                document.getElementById('notes').value = song.notes || '';
                document.getElementById('linkGuitar').value = song.linkGuitar || '';
                document.getElementById('linkDrums').value = song.linkDrums || '';
                document.getElementById('lyrics').value = song.lyrics || '';

                document.getElementById('modalTitle').textContent = 'Editar Música';
                this.modal.showModal();
            }

            async deleteSong(id) {
                if (confirm('Tem certeza que deseja remover esta música do setlist?')) {
                    await this.dbService.deleteSong(id);
                }
            }
        }

        const dbService = new DatabaseService(db);
        const ui = new UIController(dbService);
        window.ui = ui;

        const emailInput = document.getElementById('emailInput');
        const passwordInput = document.getElementById('passwordInput');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const authError = document.getElementById('authError');
        
        const authScreen = document.getElementById('auth-screen');
        const appContent = document.getElementById('app-content');
        const loadingState = document.getElementById('loadingState');

        function showError(msg) {
            authError.textContent = msg;
            setTimeout(() => authError.textContent = '', 4000);
        }

        loginBtn.addEventListener('click', async () => {
            const email = emailInput.value;
            const pass = passwordInput.value;
            if(!email || !pass) return showError('Preencha e-mail e senha.');
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                console.error(error);
                showError('Falha no login. Verifique suas credenciais.');
            }
        });

        registerBtn.addEventListener('click', async () => {
            const email = emailInput.value;
            const pass = passwordInput.value;
            if(!email || !pass) return showError('Preencha e-mail e senha.');
            if(pass.length < 6) return showError('A senha deve ter no mínimo 6 caracteres.');
            
            try {
                await createUserWithEmailAndPassword(auth, email, pass);
            } catch (error) {
                console.error(error);
                if(error.code === 'auth/email-already-in-use') {
                    showError('Este e-mail já está em uso.');
                } else {
                    showError('Erro ao criar conta.');
                }
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                authScreen.style.display = 'none';
                appContent.style.display = 'block';
                logoutBtn.style.display = 'block';
                loadingState.style.display = 'block';
                
                emailInput.value = '';
                passwordInput.value = '';
                
                dbService.listenToSongs((songs) => {
                    ui.renderSetlist(songs);
                });
            } else {
                authScreen.style.display = 'block';
                appContent.style.display = 'none';
                logoutBtn.style.display = 'none';
                document.getElementById('setlist-container').innerHTML = '';
            }
        });
    </script>
</body>
</html>
