<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Amigo Secreto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        select, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #218838; }
        .hidden { display: none; }
        #resultado-box {
            margin-top: 20px;
            padding: 20px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 5px;
        }
        .nome-destaque {
            font-size: 24px;
            font-weight: bold;
            color: #856404;
            display: block;
            margin-top: 10px;
        }
        .bloqueado {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 20px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="tela-selecao">
        <h2>Amigo Secreto 🎁</h2>
        <p>Selecione seu nome na lista:</p>
        <select id="participante">
            <option value="">-- Escolha seu nome --</option>
            <option value="Eduardo">Eduardo</option>
            <option value="Fátima">Fátima</option>
            <option value="Gabriel">Gabriel</option>
            <option value="Henrique">Henrique</option>
            <option value="Isabela">Isabela</option>
            <option value="Jonas">Jonas</option>
            <option value="Kamila">Kamila</option>
            <option value="Patricia">Patricia</option>
            <option value="Renato">Renato</option>
        </select>
        <button onclick="revelarAmigo()">Ver meu Amigo</button>
    </div>

    <div class="container hidden" id="tela-resultado">
        <h2>Pronto!</h2>
        <div id="resultado-box">
            Seu Amigo Secreto é:
            <span class="nome-destaque" id="nome-sorteado"></span>
        </div>
        <p style="font-size: 14px; color: #666; margin-top: 15px;">Tire um print! Se você fechar esta página, não poderá ver novamente.</p>
    </div>

    <div class="container hidden" id="tela-bloqueio">
        <h2>Acesso Bloqueado 🛑</h2>
        <div class="bloqueado">
            Você já visualizou o seu amigo secreto neste dispositivo!
        </div>
    </div>

    <script>
        // Sorteio pré-gerado e totalmente embaralhado. Ninguém tira a si mesmo.
        const baseDeDados = {
            "Gabriel": "RWR1YXJkbw==",   // (Ofuscado)
            "Eduardo": "RsOhdGltYQ==",     // (Ofuscado)
            "Fátima": "SGVucmlxdWU=",    // (Ofuscado)
            "Henrique": "SXNhYmVsYQ==",  // (Ofuscado)
            "Isabela": "UmVuYXRv",       // (Ofuscado)
            "Renato": "UGF0cmljaWE=",    // (Ofuscado)
            "Patricia": "S2FtaWxh",      // (Ofuscado)
            "Kamila": "Sm9uYXM=",        // (Ofuscado)
            "Jonas": "R2FicmllbA=="      // (Ofuscado)
        };

        if (localStorage.getItem("amigoSecretoVisualizado")) {
            document.getElementById("tela-selecao").classList.add("hidden");
            document.getElementById("tela-bloqueio").classList.remove("hidden");
        }

        function revelarAmigo() {
            const participante = document.getElementById("participante").value;
            
            if (!participante) {
                alert("Por favor, selecione seu nome.");
                return;
            }

            if (!confirm(`Você selecionou ${participante}. Tem certeza? Essa ação não pode ser desfeita.`)) {
                return;
            }

            const decodificado = decodeURIComponent(escape(atob(baseDeDados[participante])));
            document.getElementById("nome-sorteado").innerText = decodificado;
            
            document.getElementById("tela-selecao").classList.add("hidden");
            document.getElementById("tela-resultado").classList.remove("hidden");

            localStorage.setItem("amigoSecretoVisualizado", "true");
        }
    </script>
</body>
</html>
