<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Visitas - Imóveis v1.2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #333;
        }
        
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover { background: #0056b3; }
        
        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-actions {
            display: flex;
            gap: 10px;
        }
        .btn-incluir { background: #28a745; padding: 10px 20px; width: auto; font-weight: bold; }
        .btn-incluir:hover { background: #218838; }
        .btn-logout { background: #dc3545; padding: 10px 20px; width: auto; }
        .btn-logout:hover { background: #c82333; }
        .btn-login { background: #007bff; padding: 10px 20px; width: auto; }

        /* Modais */
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 90%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-height: 90vh;
            overflow-y: auto;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5em;
            cursor: pointer;
            color: #888;
        }
        .close-btn:hover { color: #333; }
        #btn-salvar-modal { background: #28a745; margin-top: 10px; font-weight: bold; }
        #btn-salvar-modal:hover { background: #218838; }

        #modal-anotacao {
            background-color: #fff9e6;
            resize: vertical;
        }

        /* Cards */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card-content { padding: 10px 0; flex-grow: 1; }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0 5px;
        }
        .card-header h3 { margin: 0; font-size: 1.2em; }
        
        .star-btn { cursor: pointer; font-size: 1.5em; user-select: none; transition: transform 0.2s; }
        .star-btn:hover { transform: scale(1.2); }
        .star-guest { font-size: 1.5em; user-select: none; color: #555; } 

        .price { color: #27ae60; font-weight: bold; font-size: 1.1em; margin-bottom: 10px; }
        
        /* Contêiner dos Links e Botões de Acesso */
        .links-container {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .links-container > a {
            flex: 1;
            display: block; 
            text-align: center; 
            color: white; 
            text-decoration: none; 
            padding: 10px;
            border-radius: 5px;
        }
        .btn-link { background: #007bff; }
        .btn-link:hover { background: #0056b3; }
        .btn-video { background: #dc3545; }
        .btn-video:hover { background: #c82333; }
        
        .notes-area {
            width: 100%; border: 1px solid #ddd; border-radius: 5px;
            padding: 8px; font-family: inherit; font-size: 0.9em;
            resize: none; box-sizing: border-box;
            background-color: #fff9e6; margin-bottom: 10px;
            cursor: default;
        }
        
        .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-edit { background: #17a2b8; flex: 1; padding: 8px; font-size: 0.9em; }
        .btn-edit:hover { background: #138496; }
        .btn-archive { background: #fd7e14; flex: 1; padding: 8px; font-size: 0.9em; }
        .btn-archive:hover { background: #e86e10; }
        .btn-delete { background: #dc3545; flex: 1; padding: 8px; font-size: 0.9em; }
        .btn-delete:hover { background: #c82333; }
        .btn-up, .btn-down { background: #6c757d; flex: 0.3; padding: 8px; font-size: 1.1em; }
        .btn-up:hover, .btn-down:hover { background: #5a6268; }
        
        .divisor { max-width: 1200px; margin: 40px auto; border: 0; border-top: 2px solid #ddd; }
        
        #lista-arquivados .card { opacity: 0.75; }
        #lista-arquivados .card:hover { opacity: 1; }
    </style>
</head>
<body>

    <div id="app-screen">
        <div class="top-bar">
            <h1>Imóveis Selecionados</h1>
            <div class="top-actions">
                <button id="btn-abrir-login" class="btn-login">Login Restrito</button>
                <button id="btn-abrir-incluir" class="btn-incluir" style="display: none;">+ Incluir Imóvel</button>
                <button id="btn-logout" class="btn-logout" style="display: none;">Sair</button>
            </div>
        </div>

        <h2>⭐ Imóveis Preferenciais</h2>
        <div class="container" id="lista-preferenciais"></div>

        <hr class="divisor">

        <h2>Outros Imóveis</h2>
        <div class="container" id="lista-outros"></div>

        <hr class="divisor">

        <h2>📁 Imóveis Arquivados</h2>
        <div class="container" id="lista-arquivados"></div>
    </div>

    <!-- Modal de Login -->
    <div id="modal-login" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" id="btn-fechar-login">&times;</span>
            <h2>Entrar no Sistema</h2>
            <input type="email" id="email" placeholder="Seu E-mail">
            <input type="password" id="senha" placeholder="Sua Senha">
            <button id="btn-login">Entrar</button>
            <p id="login-erro" style="color: red; display: none; margin-top: 10px;">Erro ao fazer login.</p>
        </div>
    </div>

    <!-- Modal Único para Adicionar/Editar -->
    <div id="modal-imovel" class="modal-overlay">
        <div class="modal-content" style="max-width: 500px;">
            <span class="close-btn" id="btn-fechar-modal">&times;</span>
            <h2 id="modal-titulo-texto">Adicionar Imóvel</h2>
            
            <input type="hidden" id="modal-id"> 
            <input type="text" id="modal-titulo" placeholder="Nome (Ex: Jardins do Lago Q9)">
            <input type="number" id="modal-preco" placeholder="Preço (Ex: 2500000)">
            <select id="modal-status">
                <option value="outros" selected>Outros</option>
                <option value="preferencial">⭐ Preferencial</option>
                <option value="arquivados">📁 Arquivado</option>
            </select>
            <input type="url" id="modal-imagem" placeholder="URL da Imagem">
            <input type="url" id="modal-link" placeholder="Link do Anúncio">
            <input type="url" id="modal-video" placeholder="Link do Vídeo no YouTube (Opcional)">
            <textarea id="modal-anotacao" placeholder="Anotações sobre a negociação..." rows="4"></textarea>
            
            <button id="btn-salvar-modal">Salvar Imóvel</button>
        </div>
    </div>

    <!-- Script de Integração com Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getDatabase, ref, onValue, push, update, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBdrKX1kkYmWp8Vb1M8eX3nqaHnvFZ4afk",
            authDomain: "imoveis-39378.firebaseapp.com",
            projectId: "imoveis-39378",
            storageBucket: "imoveis-39378.firebasestorage.app",
            messagingSenderId: "239923130312",
            appId: "1:239923130312:web:5f926ef4fbfe0224529afd",
            databaseURL: "https://imoveis-39378-default-rtdb.firebaseio.com" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let isLoggedIn = false;
        let imoveisData = { preferencial: [], outros: [], arquivados: [] };

        const listaPreferenciais = document.getElementById('lista-preferenciais');
        const listaOutros = document.getElementById('lista-outros');
        const listaArquivados = document.getElementById('lista-arquivados');
        
        const modalImovel = document.getElementById('modal-imovel');
        const modalLogin = document.getElementById('modal-login');
        
        onAuthStateChanged(auth, (user) => {
            isLoggedIn = !!user;
            
            document.getElementById('btn-abrir-login').style.display = isLoggedIn ? 'none' : 'inline-block';
            document.getElementById('btn-abrir-incluir').style.display = isLoggedIn ? 'inline-block' : 'none';
            document.getElementById('btn-logout').style.display = isLoggedIn ? 'inline-block' : 'none';
            
            if (isLoggedIn) {
                modalLogin.style.display = 'none'; 
                document.getElementById('email').value = '';
                document.getElementById('senha').value = '';
                document.getElementById('login-erro').style.display = 'none';
            }
            
            renderizarTela();
        });

        document.getElementById('btn-abrir-login').addEventListener('click', () => modalLogin.style.display = 'flex');
        document.getElementById('btn-fechar-login').addEventListener('click', () => modalLogin.style.display = 'none');
        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));
        
        document.getElementById('btn-login').addEventListener('click', () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('senha').value)
                .catch(() => document.getElementById('login-erro').style.display = 'block');
        });

        onValue(ref(db, 'imoveis'), (snapshot) => {
            let prefs = [];
            let outros = [];
            let arquivados = [];

            snapshot.forEach((childSnapshot) => {
                const item = childSnapshot.val();
                item.id = childSnapshot.key;
                item.ordem = item.ordem !== undefined ? item.ordem : Date.now();
                
                if (item.status === 'preferencial') prefs.push(item);
                else if (item.status === 'arquivados') arquivados.push(item);
                else outros.push(item);
            });

            prefs.sort((a, b) => a.ordem - b.ordem);
            outros.sort((a, b) => a.ordem - b.ordem);
            arquivados.sort((a, b) => a.ordem - b.ordem);

            imoveisData = { preferencial: prefs, outros: outros, arquivados: arquivados };
            renderizarTela();
        });

        const formatarPreco = (valor) => Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        function renderizarTela() {
            listaPreferenciais.innerHTML = '';
            listaOutros.innerHTML = '';
            listaArquivados.innerHTML = '';

            const renderCard = (imovel, container) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const estrelaHTML = isLoggedIn 
                    ? `<span class="star-btn" data-id="${imovel.id}" data-atual="${imovel.status}" title="Mover categoria">${imovel.status === 'preferencial' ? '⭐' : '☆'}</span>`
                    : `<span class="star-guest">${imovel.status === 'preferencial' ? '⭐' : ''}</span>`;
                
                const textoArquivar = imovel.status === 'arquivados' ? 'Restaurar' : 'Arquivar';
                
                // Condicional para o botão de vídeo
                const videoHTML = imovel.video ? `<a href="${imovel.video}" class="btn-video" target="_blank">▶️ Vídeo</a>` : '';
                
                const botoesAcao = isLoggedIn ? `
                    <div class="card-actions">
                        <button class="btn-up" data-id="${imovel.id}" data-status="${imovel.status}" title="Mover para cima">⬆️</button>
                        <button class="btn-down" data-id="${imovel.id}" data-status="${imovel.status}" title="Mover para baixo">⬇️</button>
                        <button class="btn-edit" data-id="${imovel.id}">Editar</button>
                        <button class="btn-archive" data-id="${imovel.id}" data-atual="${imovel.status}">${textoArquivar}</button>
                        <button class="btn-delete" data-id="${imovel.id}">Excluir</button>
                    </div>
                ` : '';

                card.innerHTML = `
                    <img src="${imovel.imagem}" alt="Foto da Casa" onerror="this.src='https://via.placeholder.com/400x200?text=Sem+Imagem'">
                    <div class="card-content">
                        <div class="card-header">
                            <h3>${imovel.titulo}</h3>
                            ${estrelaHTML}
                        </div>
                        <p class="price">${formatarPreco(imovel.preco)}</p>
                        <div class="links-container">
                            <a href="${imovel.link}" class="btn-link" target="_blank">Ver Anúncio</a>
                            ${videoHTML}
                        </div>
                    </div>
                    <textarea class="notes-area" rows="3" readonly placeholder="${imovel.anotacoes ? '' : 'Sem anotações no momento.'}">${imovel.anotacoes || ''}</textarea>
                    ${botoesAcao}
                `;
                container.appendChild(card);
            };

            imoveisData.preferencial.forEach(imovel => renderCard(imovel, listaPreferenciais));
            imoveisData.outros.forEach(imovel => renderCard(imovel, listaOutros));
            imoveisData.arquivados.forEach(imovel => renderCard(imovel, listaArquivados));
        }

        // ==== CONTROLES DO MODAL DE IMÓVEIS ====
        const inputId = document.getElementById('modal-id');
        const inputTitulo = document.getElementById('modal-titulo');
        const inputPreco = document.getElementById('modal-preco');
        const inputStatus = document.getElementById('modal-status');
        const inputImagem = document.getElementById('modal-imagem');
        const inputLink = document.getElementById('modal-link');
        const inputVideo = document.getElementById('modal-video');
        const inputAnotacao = document.getElementById('modal-anotacao');

        function abrirModal(modo, id = null) {
            if (!isLoggedIn) return; 
            
            modalImovel.style.display = 'flex'; 
            if (modo === 'incluir') {
                document.getElementById('modal-titulo-texto').innerText = 'Adicionar Novo Imóvel';
                inputId.value = ''; 
                inputTitulo.value = '';
                inputPreco.value = '';
                inputStatus.value = 'outros'; 
                inputImagem.value = '';
                inputLink.value = '';
                inputVideo.value = '';
                inputAnotacao.value = '';
            } else if (modo === 'editar' && id) {
                document.getElementById('modal-titulo-texto').innerText = 'Editar Imóvel';
                inputId.value = id; 
                get(ref(db, `imoveis/${id}`)).then((snapshot) => {
                    if (snapshot.exists()) {
                        const dados = snapshot.val();
                        inputTitulo.value = dados.titulo || '';
                        inputPreco.value = dados.preco || '';
                        inputStatus.value = dados.status || 'outros';
                        inputImagem.value = dados.imagem || '';
                        inputLink.value = dados.link || '';
                        inputVideo.value = dados.video || '';
                        inputAnotacao.value = dados.anotacoes || '';
                    }
                });
            }
        }

        document.getElementById('btn-abrir-incluir').addEventListener('click', () => abrirModal('incluir'));
        document.getElementById('btn-fechar-modal').addEventListener('click', () => modalImovel.style.display = 'none');
        
        window.addEventListener('click', (e) => { 
            // Removi a linha do modalImovel daqui!
            if (e.target === modalLogin) modalLogin.style.display = 'none';
        });
        document.getElementById('btn-salvar-modal').addEventListener('click', () => {
            if (!isLoggedIn) return;
            
            const id = inputId.value; 
            const dadosImovel = {
                titulo: inputTitulo.value,
                preco: inputPreco.value,
                status: inputStatus.value,
                imagem: inputImagem.value,
                link: inputLink.value,
                video: inputVideo.value,
                anotacoes: inputAnotacao.value,
                ordem: Date.now() 
            };

            if (!dadosImovel.titulo || !dadosImovel.preco) return alert("Preencha Título e Preço.");

            if (id) update(ref(db, `imoveis/${id}`), dadosImovel).then(() => modalImovel.style.display = 'none');
            else push(ref(db, 'imoveis'), dadosImovel).then(() => modalImovel.style.display = 'none');
        });

        document.addEventListener('click', (e) => {
            if (!isLoggedIn) return;

            if (e.target.classList.contains('btn-delete')) {
                if (confirm('Tem certeza que deseja excluir este imóvel?')) {
                    remove(ref(db, `imoveis/${e.target.getAttribute('data-id')}`));
                }
            }
            
            if (e.target.classList.contains('btn-edit')) {
                abrirModal('editar', e.target.getAttribute('data-id'));
            }
            
            if (e.target.classList.contains('btn-archive')) {
                const id = e.target.getAttribute('data-id');
                const statusAtual = e.target.getAttribute('data-atual');
                const novoStatus = statusAtual === 'arquivados' ? 'outros' : 'arquivados';
                update(ref(db, `imoveis/${id}`), { status: novoStatus, ordem: Date.now() });
            }

            if (e.target.classList.contains('star-btn')) {
                const id = e.target.getAttribute('data-id');
                const novoStatus = e.target.getAttribute('data-atual') === 'preferencial' ? 'outros' : 'preferencial';
                update(ref(db, `imoveis/${id}`), { status: novoStatus, ordem: Date.now() });
            }

            const isUp = e.target.classList.contains('btn-up');
            const isDown = e.target.classList.contains('btn-down');
            if (isUp || isDown) {
                const id = e.target.getAttribute('data-id');
                const status = e.target.getAttribute('data-status');
                
                let lista = imoveisData[status];
                const index = lista.findIndex(i => i.id === id);
                
                if (isUp && index > 0) {
                    const temp = lista[index];
                    lista[index] = lista[index - 1];
                    lista[index - 1] = temp;
                } else if (isDown && index < lista.length - 1) {
                    const temp = lista[index];
                    lista[index] = lista[index + 1];
                    lista[index + 1] = temp;
                } else return; 

                const updates = {};
                lista.forEach((item, idx) => updates[`imoveis/${item.id}/ordem`] = idx);
                update(ref(db), updates);
            }
        });

    </script>
</body>
</html>
