<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Just Dance</title>
    <style>
        :root {
            --primary-color: #6200ea;
            --secondary-color: #00d2ff;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: #fff;
            --star-bg: #fffde7;
            --candy-bg: #fff0f5;
            --border-radius: 12px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 10px;
            margin-bottom: 25px;
            font-size: 1.8rem;
        }

        /* --- Controles --- */
        .controls {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .control-group {
            flex: 1;
            min-width: 140px;
        }

        .control-group.full-width {
            flex-basis: 100%;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.85em;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff;
            appearance: none;
            -webkit-appearance: none;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='gray' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 16px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(98, 0, 234, 0.1);
        }

        #countDisplay {
            text-align: right;
            margin-bottom: 10px;
            color: #777;
            font-size: 0.85em;
            font-weight: 500;
        }

        /* --- Tabela --- */
        .results-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: transparent;
        }

        .results-table thead {
            background-color: var(--primary-color);
            color: white;
        }

        .results-table th {
            padding: 15px;
            text-align: left;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .results-table th:first-child { border-top-left-radius: var(--border-radius); }
        .results-table th:last-child { border-top-right-radius: var(--border-radius); }

        .results-table tbody tr {
            background-color: var(--card-bg);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: transform 0.2s;
        }

        .results-table td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
        }

        /* Cores de Destaque */
        tr.highlight-star { background-color: var(--star-bg) !important; }
        tr.highlight-star td:first-child { border-left: 4px solid #ffd700; }

        tr.highlight-candy { background-color: var(--candy-bg) !important; }
        tr.highlight-candy td:first-child { border-left: 4px solid #ff69b4; }

        .game-tag {
            display: inline-block;
            padding: 5px 10px;
            background-color: #eee;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: bold;
            color: #555;
        }

        /* Colunas Específicas */
        .icon-col { font-size: 1.2em; text-align: center; width: 40px; }
        .num-col { text-align: center; width: 40px; color: #888; font-weight: bold; }

        /* --- MOBILE --- */
    @media (max-width: 600px) {
        body { padding: 10px; }
        .controls { padding: 15px; gap: 10px; top: 0; }
        h1 { font-size: 1.5rem; margin-bottom: 15px; }

        .results-table thead { display: none; }
        
        .results-table, .results-table tbody, .results-table tr, .results-table td {
            display: block; 
            width: 100%;
            box-sizing: border-box;
        }

        .results-table tr {
            margin-bottom: 15px;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #eee;
            background: #fff;
            position: relative;
        }

        .results-table td {
            padding: 10px 15px;
            padding-left: 100px;
            text-align: right;   
            position: relative;  
            border-bottom: 1px solid #f9f9f9;
            min-height: 40px;
            display: flex;       
            align-items: center;
            justify-content: flex-end; 
        }

        .results-table td::before {
            content: attr(data-label);
            position: absolute; 
            left: 15px;         
            top: 50%;           
            transform: translateY(-50%); 
            
            font-weight: bold;
            color: #888;
            font-size: 0.75em;
            text-transform: uppercase;
            text-align: left;
            width: 80px;        
        }

        .results-table td[data-label="Música"] strong,
        .results-table td[data-label="Artista"] {
            white-space: normal !important;
            word-wrap: break-word;
            display: block;
            width: 100%;       
            text-align: right;
            line-height: 1.3;
        }

        .results-table td[data-label="Música"] {
            padding-top: 15px;
            padding-bottom: 15px;
            font-size: 1.1em;
            color: var(--primary-color);
        }

        .results-table td[data-label="Jogo"] {
            display: block;    
            padding-left: 15px; 
            padding-top: 35px;  
            text-align: right;
            height: auto;
        }

        .results-table td[data-label="Jogo"]::before {
            top: 10px;
            left: 15px;
            transform: none;
        }

        .results-table td[data-label="Jogo"] .game-tag {
            display: inline-block;
            max-width: 100%;       
            white-space: normal !important; 
            text-align: center;
            line-height: 1.4;
            margin-top: 0;
        }

        .results-table td.icon-col {
            padding: 5px 15px;
            justify-content: flex-start;
            padding-left: 15px; 
            background-color: rgba(0,0,0,0.02);
            min-height: 30px;
        }
        .results-table td.icon-col::before { display: none; } 

        .results-table td.num-col {
            position: absolute;
            top: 5px;
            right: 5px;
            border: none;
            padding: 0;
            width: auto;
            min-height: 0;
            font-size: 0.8em;
            color: #ccc;
        }
        .results-table td.num-col::before { display: none; } 
        
        .control-group { min-width: 100%; }
    }
        
    </style>
</head>

<div class="container">
    <h1>💃 Catálogo Just Dance 🕺</h1>

    <div class="controls">
        <div class="control-group">
            <label for="gameSelect">Pesquisar por Jogo</label>
            <select id="gameSelect" onchange="filterData()">

            </select>
        </div>

        <div class="control-group">
            <label for="typeSelect">Pesquisar por Destaque</label>

                <option value="star">⭐ Apenas Favoritas</option>
                <option value="candy">🍭 Apenas Infantis</option>
                <option value="none">Sem destaque</option>
            </select>
        </div>

        <div class="control-group full-width">
            <label for="searchInput">Pesquisa por Texto</label>
            <input type="text" id="searchInput" placeholder="Nome da música ou artista..." onkeyup="filterData()">
        </div>
    </div>

    <div id="countDisplay">Carregando...</div>

    <table class="results-table">

                <th>Artista</th>

        </thead>
        <tbody id="tableBody">

    </table>
</div>

    let songs = [];

    function parseData() {
        const lines = rawData.trim().split('\n');
        
        songs = lines.map(line => {
            // Separa a linha em partes baseado nos espaços (TABs) e remove espaços vazios extras
            const parts = line.split('\t').map(p => p.trim()).filter(p => p !== "");
            
            let marker = "";
            let game = "";
            let title = "";
            let artist = "";

            // Como a gente sabe que as três últimas colunas sempre são Jogo, Música e Artista:
            // Pegamos de trás para frente!
            if (parts.length >= 3) {
                artist = parts.pop();
                title = parts.pop();
                game = parts.pop();
                
                // Tudo o que sobrou (se sobrou algo) é marcador (os ícones)
                marker = parts.join(' ');
            }

            return { marker, game, title, artist };
        }).filter(item => item.title !== "");

        populateGameDropdown();
        filterData();
    }

    function populateGameDropdown() {
        const games = [...new Set(songs.map(s => s.game))].sort();
        const select = document.getElementById('gameSelect');
        
        games.forEach(game => {
            if(game) {
                const option = document.createElement('option');
                option.value = game;
                option.innerText = game;
                select.appendChild(option);
            }
        });
    }

    function filterData() {
        const gameFilter = document.getElementById('gameSelect').value;
        const typeFilter = document.getElementById('typeSelect').value;
        const textFilter = document.getElementById('searchInput').value.toLowerCase();
        
        const filteredSongs = songs.filter(song => {
            const matchesGame = (gameFilter === 'all') || (song.game === gameFilter);
            const matchesText = song.title.toLowerCase().includes(textFilter) || 
                                song.artist.toLowerCase().includes(textFilter);
            
            let matchesType = true;
            if (typeFilter === 'star') matchesType = song.marker.includes('⭐');
            else if (typeFilter === 'candy') matchesType = song.marker.includes('🍭');
            else if (typeFilter === 'none') matchesType = (!song.marker.includes('⭐') && !song.marker.includes('🍭'));

            return matchesGame && matchesText && matchesType;
        });

        renderTable(filteredSongs);
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        const countDisplay = document.getElementById('countDisplay');
        tbody.innerHTML = '';

        countDisplay.innerText = `${data.length} músicas encontradas`;

        if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 30px; color: #888;">Nenhuma música encontrada com esses filtros.</td></tr>';
            return;
        }

        data.forEach((song, index) => {
            const tr = document.createElement('tr');
            
            // Define a cor de fundo (se tiver estrela fica amarelo, se tiver doce fica rosa)
            // Se tiver os dois, a estrela ganha prioridade de cor, mas o filtro de ambos vai funcionar!
            if (song.marker.includes('⭐')) tr.classList.add('highlight-star');
            else if (song.marker.includes('🍭')) tr.classList.add('highlight-candy');

            tr.innerHTML = `
                <td class="icon-col" data-label="Status">${song.marker}</td>
                <td class="num-col" data-label="Nº">${index + 1}</td>
                <td data-label="Música"><strong>${song.title}</strong></td>
                <td data-label="Artista">${song.artist}</td>
                <td data-label="Jogo"><span class="game-tag">${song.game}</span></td>
            `;
            tbody.appendChild(tr);
        });
    }

    window.onload = parseData;
