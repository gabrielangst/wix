<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brasília: Guia de Viagem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .nav-item.active { border-bottom: 2px solid white; color: white; }
        .nav-item { color: #bfdbfe; }
        
        .goog-tooltip { display: none !important; }
        .goog-tooltip:hover { display: none !important; }
        .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
        
        /* Esconde a barra superior (banner) do Google Tradutor */
        .goog-te-banner-frame.skiptranslate {
            display: none !important;
        }

        /* Força o body a não descer os 40px que o Google tenta injetar */
        body {
            top: 0px !important;
        }

        /* Garante que o cabeçalho fique grudado no topo mesmo após a tradução */
        html.translated-ltr header, html.translated-rtl header { 
            top: 0 !important; 
        }

        /* Esconde o popup de feedback/texto original do Google Tradutor */
        .VIpgJd-ZVi9od-ORHb, 
        .VIpgJd-ZVi9od-ORHb-OEVmcd, 
        .VIpgJd-yAWNEb-hvhgNd-IuizWc-i3jM8c,
        .VIpgJd-suFOdc,
        .VIpgJd-ZVi9od-smMQSb {
            display: none !important;
        }       

        /* Garante que o fundo amarelo de highlight (que aparece ao passar o mouse) não seja exibido */
        .VIpgJd-ZVi9od-aZ2wEe-wOHMyf {
            background-color: transparent !important;
            box-shadow: none !important;
            border-bottom: none !important;
        }

        /* 1. Mata o balão pelo ID raiz fixo do Google (mais seguro que a classe dinâmica) */
        #goog-gt-tt {
            display: none !important;
            visibility: hidden !important;
            opacity: 0 !important;
        }

        /* 2. Mantém o bloqueio da classe que inspecionamos */
        .VIpgJd-suFOdc {
            display: none !important;
        }

        /* 3. O SEGREDO DO MOBILE: Impede que o texto traduzido receba cliques/toques */
        .goog-text-highlight {
            background-color: transparent !important;
            border: none !important;
            box-shadow: none !important;
            pointer-events: none !important; /* Desarma o gatilho de toque na tela */
        }

        /* Remove o fundo azul (highlight) que o Google Tradutor aplica ao passar o mouse */
        font {
            background-color: transparent !important;
            box-shadow: none !important;
        }

        .goog-text-highlight {
            background-color: transparent !important;
            box-shadow: none !important;
        }

    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-blue-900 text-white sticky top-0 z-50 shadow-md">
        <div class="px-4 py-4 flex justify-between items-center max-w-7xl mx-auto">
            
            <a href="../index.html" class="flex items-center">
                <img src="../logo_index.png" alt="Guia de Brasília" class="h-8 w-auto">
            </a>

            <div class="relative z-50 text-gray-800">
                <button onclick="document.getElementById('lang-menu').classList.toggle('hidden')" class="flex items-center space-x-2 bg-white/10 hover:bg-white/20 border border-white/30 text-white px-3 py-1.5 rounded-lg transition shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg class="w-3 h-3 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                
                <div id="lang-menu" class="hidden absolute top-full right-0 mt-2 w-44 bg-white rounded-xl shadow-xl z-50 overflow-hidden border border-gray-100 max-h-[70vh] overflow-y-auto">
                    <button onclick="mudarIdioma('pt')" class="flex items-center w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 border-b border-gray-50 transition"><span class="mr-3 text-lg">🇧🇷</span> Português</button>
                    <button onclick="mudarIdioma('en')" class="flex items-center w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 border-b border-gray-50 transition"><span class="mr-3 text-lg">🇺🇸</span> English</button>
                    <button onclick="mudarIdioma('es')" class="flex items-center w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 border-b border-gray-50 transition"><span class="mr-3 text-lg">🇪🇸</span> Español</button>
                    <button onclick="mudarIdioma('it')" class="flex items-center w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 border-b border-gray-50 transition"><span class="mr-3 text-lg">🇮🇹</span> Italiano</button>
                    <button onclick="mudarIdioma('fr')" class="flex items-center w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 border-b border-gray-50 transition"><span class="mr-3 text-lg">🇫🇷</span> Français</button>
                    <button onclick="mudarIdioma('zh-CN')" class="flex items-center w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 border-b border-gray-50 transition"><span class="mr-3 text-lg">🇨🇳</span> 中文 (Chinês)</button>
                    <button onclick="mudarIdioma('ja')" class="flex items-center w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 border-b border-gray-50 transition"><span class="mr-3 text-lg">🇯🇵</span> 日本語 (Japonês)</button>
                    <button onclick="mudarIdioma('tr')" class="flex items-center w-full text-left px-4 py-3 text-sm text-gray-700 hover:bg-gray-50 transition"><span class="mr-3 text-lg">🇹🇷</span> Türkçe (Turco)</button>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto relative px-4 pb-4">
            <div id="menu-wrapper" class="overflow-hidden max-h-[28px] transition-[max-height] duration-300 ease-in-out pr-8 relative">
                <nav id="menu-capitulos" class="flex flex-wrap items-center gap-x-6 gap-y-4 no-scrollbar">
                    <!-- Injetado via JS -->
                </nav>
            </div>
            
            <div id="btn-toggle-container" class="absolute right-4 top-0 h-[28px] w-24 flex items-start justify-end bg-gradient-to-l from-blue-900 via-blue-900/90 to-transparent hidden pointer-events-none">
                <button id="btn-toggle-menu" class="pointer-events-auto flex items-center justify-center text-white h-full hover:text-blue-200 transition pl-4">
                    <span id="text-mais" class="text-sm font-medium mr-1 drop-shadow-md">Mais</span>
                    <span id="text-menos" class="text-sm font-medium mr-1 hidden drop-shadow-md">Menos</span>
                    <svg id="icon-down" class="w-4 h-4 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    <svg id="icon-up" class="w-4 h-4 hidden drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <div id="google_translate_element" style="display:none;"></div>

    <main class="p-4 max-w-7xl mx-auto relative">
        <div class="mb-6 flex justify-between items-center">
            <h2 id="titulo-secao" class="text-2xl font-bold text-gray-900">Carregando...</h2>
            
            <button id="btn-voltar" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition items-center text-sm shadow-sm">
                ← Voltar
            </button>
        </div>

        <div id="conteudo-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div id="loader" class="col-span-full text-center text-gray-500 py-10">Conectando ao banco de dados...</div>
        </div>

        <div id="detalhe-container" class="hidden bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden max-w-4xl mx-auto">
            <!-- Injetado via JS -->
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClUPY28pPyKv4dyhdgRLxnVpxVgBo8-Rc",
            authDomain: "guiadebrasilia-c0a80.firebaseapp.com",
            databaseURL: "https://guiadebrasilia-c0a80-default-rtdb.firebaseio.com",
            projectId: "guiadebrasilia-c0a80",
            storageBucket: "guiadebrasilia-c0a80.firebasestorage.app",
            messagingSenderId: "515833661737",
            appId: "1:515833661737:web:c63567a2e528dfef910f38"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const menuContainer = document.getElementById('menu-capitulos');
        const conteudoContainer = document.getElementById('conteudo-container');
        const detalheContainer = document.getElementById('detalhe-container');
        const tituloSecao = document.getElementById('titulo-secao');
        const btnVoltar = document.getElementById('btn-voltar');
        
        let capituloAtual = null;
        let itensAtuais = []; 

        const wrapper = document.getElementById('menu-wrapper');
        const iconDown = document.getElementById('icon-down');
        const iconUp = document.getElementById('icon-up');
        const textMais = document.getElementById('text-mais');
        const textMenos = document.getElementById('text-menos');
        const btnToggleContainer = document.getElementById('btn-toggle-container');
        const btnToggleMenu = document.getElementById('btn-toggle-menu');
        let menuExpanded = false;

        btnToggleMenu.addEventListener('click', () => {
            menuExpanded = !menuExpanded;
            if (menuExpanded) {
                wrapper.classList.remove('max-h-[28px]');
                wrapper.classList.add('max-h-[500px]');
                iconDown.classList.add('hidden');
                iconUp.classList.remove('hidden');
                textMais.classList.add('hidden');
                textMenos.classList.remove('hidden');
                btnToggleContainer.classList.remove('from-blue-900', 'via-blue-900/80', 'bg-gradient-to-l');
            } else {
                wrapper.classList.add('max-h-[28px]');
                wrapper.classList.remove('max-h-[500px]');
                iconDown.classList.remove('hidden');
                iconUp.classList.add('hidden');
                textMais.classList.remove('hidden');
                textMenos.classList.add('hidden');
                btnToggleContainer.classList.add('from-blue-900', 'via-blue-900/80', 'bg-gradient-to-l');
            }
        });

        function checkMenuOverflow() {
            if (menuContainer.scrollHeight > 35) {
                btnToggleContainer.classList.remove('hidden');
            } else {
                btnToggleContainer.classList.add('hidden');
            }
        }
        window.addEventListener('resize', checkMenuOverflow);

        onValue(ref(db, 'capitulos'), (snapshot) => {
            menuContainer.innerHTML = '';
            const data = snapshot.val();
            
            if (data) {
                const capitulos = Object.entries(data).map(([key, val]) => ({ id: key, ...val })).sort((a, b) => a.ordem - b.ordem);
                let temSelecao = false;

                capitulos.forEach((cap) => {
                    if (cap.is_separator) {
                        const div = document.createElement('div');
                        div.className = "flex items-center text-blue-300 opacity-80 cursor-default select-none";
                        div.innerHTML = `<span class="border-l-2 border-blue-400/50 h-6 mx-2"></span> <span class="text-[10px] font-bold uppercase tracking-widest ml-1">${cap.titulo || ''}</span>`;
                        menuContainer.appendChild(div);
                    } else {
                        const isActive = (!capituloAtual && !temSelecao) || (capituloAtual === cap.id);
                        if (isActive) temSelecao = true;

                        const a = document.createElement('a');
                        a.href = "#";
                        a.className = `text-sm font-medium pb-1 nav-item transition whitespace-nowrap ${isActive ? 'active' : ''}`;
                        a.innerHTML = `<span class="mr-1">${cap.icone || ''}</span> ${cap.titulo}`;
                        
                        a.addEventListener('click', (e) => {
                            e.preventDefault();
                            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                            a.classList.add('active');
                            carregarConteudo(cap.id, cap.titulo);
                            
                            if (menuExpanded) btnToggleMenu.click();
                            
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        });

                        menuContainer.appendChild(a);
                    }
                });

                setTimeout(checkMenuOverflow, 100);

                if (!capituloAtual && capitulos.length > 0) {
                    const primeiroValido = capitulos.find(c => !c.is_separator);
                    if(primeiroValido) carregarConteudo(primeiroValido.id, primeiroValido.titulo);
                }
            }
        });

        function carregarConteudo(capituloId, titulo) {
            capituloAtual = capituloId;
            tituloSecao.textContent = titulo;
            conteudoContainer.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">Carregando itens...</div>';
            
            fecharDetalheSilencioso();

            get(ref(db, `conteudo/${capituloId}`)).then((snapshot) => {
                conteudoContainer.innerHTML = '';
                const data = snapshot.val();
                
                if (data) {
                    itensAtuais = Object.entries(data).map(([key, val]) => ({ key, ...val })).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
                    let numeroGlobal = 1; 

                    itensAtuais.forEach((item) => {
                        if (item.is_separator) {
                            const div = document.createElement('div');
                            div.className = "col-span-full mt-6 mb-2 flex items-center";
                            const titleHtml = item.titulo 
                                ? `<h3 class="text-lg font-bold text-gray-800 uppercase tracking-widest mx-4">${item.titulo}</h3>`
                                : '';
                            div.innerHTML = `<div class="flex-grow border-t-2 border-gray-200"></div>${titleHtml}<div class="flex-grow border-t-2 border-gray-200"></div>`;
                            conteudoContainer.appendChild(div);
                        } else {
                            const numero = numeroGlobal++;
                            const card = document.createElement('article');
                            card.className = "bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border border-gray-100 overflow-hidden flex flex-col h-full cursor-pointer";
                            
                            card.addEventListener('click', () => {
                                window.abrirDetalhe(item.key, numero);
                            });
                            
                            let tagsHTML = '';
                            if (item.audioguia) tagsHTML += `<span class="inline-flex items-center bg-green-100 text-green-800 text-[10px] font-bold uppercase px-2 py-1 rounded mr-2 tracking-wide mb-2">🎧 Audioguia</span>`;
                            if (item.passeio_guiado) tagsHTML += `<span class="inline-flex items-center bg-blue-100 text-blue-800 text-[10px] font-bold uppercase px-2 py-1 rounded mr-2 tracking-wide mb-2">🗣️ Passeio Guiado</span>`;

                            const imgHTML = item.imagem_url 
                                ? `<img src="${item.imagem_url}" alt="${item.titulo}" class="w-full h-48 object-cover border-b border-gray-100">` 
                                : '';

                            card.innerHTML = `
                                ${imgHTML}
                                <div class="p-5 flex flex-col flex-1">
                                    <h3 class="text-lg font-bold text-gray-900 mb-2 leading-tight flex items-start">
                                        <span class="text-blue-600 mr-2 opacity-80 mt-0.5">${numero}.</span> 
                                        <span>${item.titulo || ''}</span>
                                    </h3>
                                    
                                    <div class="flex-1 ml-6">
                                        ${item.descricao ? `<p class="text-gray-600 text-sm leading-relaxed line-clamp-3">${item.descricao.replace(/\n/g, '<br>')}</p>` : ''}
                                    </div>
                                    
                                    ${ (item.funcionamento || item.valor || tagsHTML) ? `
                                    <div class="mt-4 pt-4 border-t border-gray-100 ml-6">
                                        ${tagsHTML ? `<div>${tagsHTML}</div>` : ''}
                                        ${item.funcionamento ? `<div class="flex items-center text-sm text-gray-600 mt-1"><span class="mr-2 opacity-70">🕒</span> ${item.funcionamento}</div>` : ''}
                                        ${item.valor ? `<div class="flex items-center text-sm text-gray-600 mt-1"><span class="mr-2 opacity-70">🎟️</span> ${item.valor}</div>` : ''}
                                    </div>
                                    ` : '' }
                                </div>
                            `;
                            conteudoContainer.appendChild(card);
                        }
                    });
                } else {
                    conteudoContainer.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10 bg-white rounded-xl border border-gray-100">Nenhum conteúdo cadastrado neste tópico ainda.</div>';
                }
            }).catch(error => {
                conteudoContainer.innerHTML = `<div class="col-span-full text-red-500 text-center py-10">Erro ao carregar: ${error.message}</div>`;
            });
        }

        window.abrirDetalhe = (itemKey, numero) => {
            const item = itensAtuais.find(i => i.key === itemKey);
            if (!item) return;

            let tagsHTML = '';
            if (item.audioguia) tagsHTML += `<span class="inline-flex items-center bg-green-100 text-green-800 text-xs font-bold uppercase px-3 py-1.5 rounded mr-2 tracking-wide mb-2">🎧 Audioguia</span>`;
            if (item.passeio_guiado) tagsHTML += `<span class="inline-flex items-center bg-blue-100 text-blue-800 text-xs font-bold uppercase px-3 py-1.5 rounded mr-2 tracking-wide mb-2">🗣️ Passeio Guiado</span>`;

            // Bloco dinâmico de Links gerado se existirem itens cadastrados
            let linksHTML = '';
            if (item.links) {
                const arrLinks = Array.isArray(item.links) ? item.links : Object.values(item.links);
                if (arrLinks.length > 0) {
                    linksHTML = `
                        <div class="col-span-1 sm:col-span-2 pt-5 mt-2 border-t border-gray-100">
                            <span class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">Links Úteis</span>
                            <div class="flex flex-wrap gap-2">
                                ${arrLinks.map(l => `
                                    <a href="${l.url}" target="_blank" class="inline-flex items-center text-sm bg-blue-50 text-blue-700 hover:bg-blue-100 px-3 py-2 rounded-lg transition font-medium border border-blue-100">
                                        <span class="mr-2 opacity-70">🔗</span> ${l.titulo}
                                    </a>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }

            const imgHTML = item.imagem_url 
                ? `<img src="${item.imagem_url}" alt="${item.titulo}" class="w-full h-64 sm:h-96 object-cover border-b border-gray-100">` 
                : '';

            detalheContainer.innerHTML = `
                ${imgHTML}
                <div class="p-6 sm:p-10">
                    <h3 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-6 flex items-start">
                        <span class="text-blue-600 mr-3 opacity-80">${numero}.</span> 
                        <span>${item.titulo || ''}</span>
                    </h3>
                    
                    <div class="ml-0 sm:ml-9 space-y-6">
                        ${item.descricao ? `<p class="text-gray-700 text-base leading-relaxed">${item.descricao.replace(/\n/g, '<br>')}</p>` : ''}
                        
                        ${item.curiosidades ? `
                            <div class="bg-blue-50 p-5 rounded-xl border border-blue-100">
                                <h4 class="font-bold text-blue-900 mb-2">💡 Curiosidade</h4>
                                <p class="text-gray-700 text-sm leading-relaxed">${item.curiosidades.replace(/\n/g, '<br>')}</p>
                            </div>
                        ` : ''}

                        ${ (item.funcionamento || item.valor || tagsHTML || linksHTML) ? `
                        <div class="pt-6 border-t border-gray-100">
                            ${tagsHTML ? `<div class="mb-4">${tagsHTML}</div>` : ''}
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                ${item.funcionamento ? `
                                    <div class="flex items-start text-gray-600">
                                        <span class="mr-3 opacity-70 text-lg">🕒</span> 
                                        <div>
                                            <span class="block text-xs font-bold uppercase tracking-wider text-gray-400">Funcionamento</span>
                                            <span class="text-sm font-medium">${item.funcionamento}</span>
                                        </div>
                                    </div>
                                ` : ''}
                                ${item.valor ? `
                                    <div class="flex items-start text-gray-600">
                                        <span class="mr-3 opacity-70 text-lg">🎟️</span> 
                                        <div>
                                            <span class="block text-xs font-bold uppercase tracking-wider text-gray-400">Ingresso / Valor</span>
                                            <span class="text-sm font-medium">${item.valor}</span>
                                        </div>
                                    </div>
                                ` : ''}
                                ${linksHTML}
                            </div>
                        </div>
                        ` : '' }
                    </div>
                </div>
            `;

            conteudoContainer.classList.add('hidden');
            detalheContainer.classList.remove('hidden');
            btnVoltar.classList.remove('hidden');

            history.pushState({ modalAtivo: true, item: itemKey }, '', `#${itemKey}`);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.addEventListener('popstate', (e) => {
            if (!e.state || !e.state.modalAtivo) {
                fecharDetalheSilencioso();
            }
        });

        btnVoltar.addEventListener('click', () => {
            history.back();
        });

        function fecharDetalheSilencioso() {
            conteudoContainer.classList.remove('hidden');
            detalheContainer.classList.add('hidden');
            btnVoltar.classList.add('hidden');
        }
    </script>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'pt',
                autoDisplay: false
            }, 'google_translate_element');
        }

        function mudarIdioma(sigla) {
            document.cookie = `googtrans=/pt/${sigla}; path=/;`;
            document.cookie = `googtrans=/pt/${sigla}; domain=.${location.hostname}; path=/;`;
            document.getElementById('lang-menu').classList.add('hidden');
            window.location.reload();
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('lang-menu');
            const btn = menu.previousElementSibling;
            if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
