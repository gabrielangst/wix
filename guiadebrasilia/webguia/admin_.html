<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Guia de Brasília</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca SortableJS para Arrastar e Soltar -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        .topico-ativo { background-color: #eff6ff; border-left: 4px solid #2563eb; }
        .separador { background-color: #f3f4f6; border-left: 4px solid #9ca3af; }
        .sortable-ghost { opacity: 0.4; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-sm">
            <h2 class="text-2xl font-bold text-center text-blue-900 mb-6">Acesso Admin</h2>
            <form id="login-form" class="space-y-4">
                <input type="email" id="email" placeholder="E-mail" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                <input type="password" id="password" placeholder="Senha" class="w-full border p-2 rounded focus:ring-2 focus:ring-blue-500" required>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">Entrar</button>
            </form>
        </div>
    </div>

    <!-- MODAL DE FORMULÁRIO INDIVIDUAL -->
    <div id="modal-form" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-xl">
            <h2 id="form-title" class="text-xl font-bold mb-4 border-b pb-2 text-blue-900">Adicionar Item</h2>
            <form id="content-form" class="space-y-4">
                <input type="hidden" id="item-ordem">

                <div>
                    <label class="block text-sm font-medium text-gray-700">Tópico Destino</label>
                    <select id="item-topico" class="w-full border p-2 rounded text-sm bg-white focus:ring-2 focus:ring-blue-500 font-medium text-blue-900" required></select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">ID Único (ex: praca_tres_poderes)</label>
                    <input type="text" id="item-key" class="w-full border p-2 rounded text-sm bg-gray-50 focus:ring-2 focus:ring-blue-500" required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Título do Item</label>
                    <input type="text" id="titulo" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Caminho da Imagem Principal (Opcional)</label>
                    <input type="text" id="imagem-url" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500" placeholder="Ex: ./img/catedral.jpg">
                </div>

                <!-- DESCRIÇÃO COM BARRA DE FERRAMENTAS INJETORA -->
                <div>
                    <div class="flex justify-between items-end mb-1">
                        <label class="block text-sm font-medium text-gray-700">Descrição / Texto</label>
                        <div class="flex space-x-2">
                            <button type="button" onclick="window.inserirImagemDescricao()" class="text-[10px] uppercase font-bold bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-1 rounded transition flex items-center">
                                📸 IMG
                            </button>
                            <button type="button" onclick="window.inserirYoutubeDescricao()" class="text-[10px] uppercase font-bold bg-red-100 hover:bg-red-200 text-red-700 px-2 py-1 rounded transition flex items-center">
                                ▶️ VID
                            </button>
                            <button type="button" onclick="window.inserirLinkDescricao()" class="text-[10px] uppercase font-bold bg-green-100 hover:bg-green-200 text-green-700 px-2 py-1 rounded transition flex items-center">
                                🔗 Link
                            </button>
                        </div>
                    </div>
                    <textarea id="descricao" rows="5" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Curiosidades (Opcional)</label>
                    <textarea id="curiosidades" rows="2" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Funcionamento</label>
                        <input type="text" id="funcionamento" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Valor/Preço</label>
                        <input type="text" id="valor" class="w-full border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <div class="pt-4 border-t border-gray-100 mt-2">
                    <div class="flex justify-between items-center mb-3">
                        <label class="block text-sm font-medium text-gray-700">Links Úteis (Opcional)</label>
                        <button type="button" id="btn-add-link" class="text-[10px] uppercase font-bold bg-blue-100 hover:bg-blue-200 text-blue-700 px-2 py-1 rounded transition">+ Adicionar Link</button>
                    </div>
                    <div id="links-container" class="space-y-2"></div>
                </div>
                
                <div class="flex items-center space-x-4 pt-2 border-t border-gray-100 pt-4">
                    <label class="flex items-center text-sm text-gray-700 cursor-pointer">
                        <input type="checkbox" id="audioguia" class="mr-2 rounded text-blue-600"> Audioguia
                    </label>
                    <label class="flex items-center text-sm text-gray-700 cursor-pointer">
                        <input type="checkbox" id="passeio_guiado" class="mr-2 rounded text-blue-600"> Passeio Guiado
                    </label>
                </div>

                <div class="flex space-x-3 pt-4 border-t border-gray-100">
                    <button type="button" id="btn-cancelar" class="flex-1 bg-gray-200 text-gray-800 font-bold py-2 rounded hover:bg-gray-300 transition">Cancelar</button>
                    <button type="submit" class="flex-1 bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700 transition">Salvar Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE IMPORTAÇÃO JSON -->
    <div id="modal-import" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-xl w-full max-w-2xl max-h-[90vh] flex flex-col shadow-xl">
            <h2 class="text-xl font-bold mb-2 border-b pb-2 text-blue-900">Importar JSON em Lote</h2>
            <p class="text-sm text-gray-600 mb-4">Cole o JSON contendo múltiplos itens. Eles serão adicionados ao tópico selecionado atualmente.</p>
            
            <textarea id="json-input" class="w-full flex-1 border p-3 rounded font-mono text-xs focus:ring-2 focus:ring-blue-500 min-h-[300px]" placeholder='{"item_id": { "titulo": "...", "descricao": "..." }}'></textarea>
            
            <div class="flex space-x-3 pt-4 mt-4 border-t border-gray-100">
                <button type="button" id="btn-cancelar-import" class="flex-1 bg-gray-200 text-gray-800 font-bold py-2 rounded hover:bg-gray-300 transition">Cancelar</button>
                <button type="button" id="btn-confirmar-import" class="flex-1 bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">Processar Importação</button>
            </div>
        </div>
    </div>

    <!-- PAINEL DE ADMINISTRAÇÃO -->
    <div id="admin-panel" class="hidden">
        <header class="bg-blue-900 text-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">Gestor de Conteúdo</h1>
                <button id="logout-btn" class="bg-red-600 px-4 py-2 rounded hover:bg-red-700 font-bold text-sm transition">Sair</button>
            </div>
        </header>

        <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-4 gap-6 mt-6">
            
            <!-- COLUNA TÓPICOS -->
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white p-0 rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <div class="p-4 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-gray-800">Tópicos</h2>
                        <div class="flex space-x-1">
                            <button onclick="window.adicionarTopico()" class="text-[10px] uppercase font-bold bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded transition">+ Tópico</button>
                            <button onclick="window.adicionarSeparadorTopico()" class="text-[10px] uppercase font-bold bg-gray-200 hover:bg-gray-300 text-gray-700 px-2 py-1 rounded transition">+ Divisor</button>
                        </div>
                    </div>
                    <div id="lista-capitulos" class="flex flex-col divide-y divide-gray-100">
                        <!-- Injetado via JS -->
                    </div>
                </div>
            </div>

            <!-- COLUNA ITENS -->
            <div class="lg:col-span-3 bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-fit">
                <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-4 border-b pb-4 gap-4">
                    <div>
                        <h2 id="titulo-tabela" class="text-xl font-bold text-gray-800">Selecione um Tópico</h2>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button id="btn-abrir-import" class="hidden bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg font-bold text-xs uppercase transition shadow-sm">
                            { } Lote JSON
                        </button>
                        <button id="btn-divisor-item" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-lg font-bold text-xs uppercase transition shadow-sm" onclick="window.adicionarSeparadorItem()">
                            + Divisor
                        </button>
                        <button id="btn-novo-item" class="hidden bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-bold text-sm transition flex items-center shadow-sm">
                            Adicionar Item
                        </button>
                    </div>
                </div>
                
                <div class="overflow-x-auto pb-10">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-3 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-12">#</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Título</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Infos</th>
                                <th class="px-4 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="bg-white divide-y divide-gray-200">
                            <tr>
                                <td colspan="4" class="px-4 py-8 text-center text-gray-500">Selecione um tópico na lista ao lado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
        import { getDatabase, ref, onValue, set, remove, update } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyClUPY28pPyKv4dyhdgRLxnVpxVgBo8-Rc",
            authDomain: "guiadebrasilia-c0a80.firebaseapp.com",
            databaseURL: "https://guiadebrasilia-c0a80-default-rtdb.firebaseio.com",
            projectId: "guiadebrasilia-c0a80",
            storageBucket: "guiadebrasilia-c0a80.firebasestorage.app",
            messagingSenderId: "515833661737",
            appId: "1:515833661737:web:c63567a2e528dfef910f38"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let capitulosData = {};
        let conteudoData = {};
        let capituloSelecionado = null;
        
        const modalForm = document.getElementById('modal-form');
        const btnNovoItem = document.getElementById('btn-novo-item');
        const btnDivisorItem = document.getElementById('btn-divisor-item');
        const btnAbrirImport = document.getElementById('btn-abrir-import');
        const btnCancelar = document.getElementById('btn-cancelar');
        const formContent = document.getElementById('content-form');
        const linksContainer = document.getElementById('links-container');
        const btnAddLink = document.getElementById('btn-add-link');
        const itemTopicoSelect = document.getElementById('item-topico'); 

        const modalImport = document.getElementById('modal-import');
        const jsonInput = document.getElementById('json-input');
        const btnCancelarImport = document.getElementById('btn-cancelar-import');
        const btnConfirmarImport = document.getElementById('btn-confirmar-import');

        // Ícone SVG para arrastar (Grip)
        const iconeArrastar = `<svg class="w-5 h-5 opacity-40 hover:opacity-100 transition" fill="currentColor" viewBox="0 0 24 24"><path d="M9 5a2 2 0 11-4 0 2 2 0 014 0zM9 12a2 2 0 11-4 0 2 2 0 014 0zM9 19a2 2 0 11-4 0 2 2 0 014 0zM19 5a2 2 0 11-4 0 2 2 0 014 0zM19 12a2 2 0 11-4 0 2 2 0 014 0zM19 19a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>`;

        // INICIALIZANDO SORTABLE JS (DRAG AND DROP)
        const listaCapitulos = document.getElementById('lista-capitulos');
        new Sortable(listaCapitulos, {
            handle: '.drag-handle-cap',
            animation: 150,
            onEnd: function (evt) {
                if (evt.oldIndex === evt.newIndex) return;
                const rows = document.querySelectorAll('#lista-capitulos .cap-item-drag');
                const updates = {};
                rows.forEach((div, index) => {
                    const key = div.getAttribute('data-key');
                    updates[`capitulos/${key}/ordem`] = index + 1;
                });
                update(ref(db), updates);
            }
        });

        const tableBody = document.getElementById('table-body');
        new Sortable(tableBody, {
            draggable: '.row-item',
            handle: '.drag-handle-item',
            animation: 150,
            onEnd: function (evt) {
                if (evt.oldIndex === evt.newIndex) return;
                window.salvarNovaOrdemItens();
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                initAdmin();
            } else {
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
            }
        });

        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
                .catch(err => alert("Erro: " + err.message));
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        function initAdmin() {
            onValue(ref(db, 'capitulos'), (snapshot) => {
                capitulosData = snapshot.val() || {};
                renderizarTopicos();
                
                if(!capituloSelecionado && Object.keys(capitulosData).length > 0) {
                    const primeiro = Object.entries(capitulosData).filter(c => !c[1].is_separator).sort((a, b) => (a[1].ordem||0) - (b[1].ordem||0))[0];
                    if(primeiro) window.selecionarTopico(primeiro[0], primeiro[1].titulo);
                } else if (capituloSelecionado && !capitulosData[capituloSelecionado]) {
                    capituloSelecionado = null;
                    document.getElementById('table-body').innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">Selecione um tópico na lista ao lado.</td></tr>`;
                    document.getElementById('titulo-tabela').textContent = "Selecione um Tópico";
                    btnNovoItem.classList.add('hidden');
                    btnDivisorItem.classList.add('hidden');
                    btnAbrirImport.classList.add('hidden');
                }
            });

            onValue(ref(db, 'conteudo'), (snapshot) => {
                conteudoData = snapshot.val() || {};
                if(capituloSelecionado) renderizarTabela();
            });
        }

        function inserirNoCursor(campoId, textoInjetado) {
            const textarea = document.getElementById(campoId);
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const atual = textarea.value;
            textarea.value = atual.substring(0, start) + textoInjetado + atual.substring(end);
            textarea.focus();
            textarea.selectionStart = textarea.selectionEnd = start + textoInjetado.length;
        }

        window.inserirImagemDescricao = () => {
            const url = prompt("Cole o link (URL) da imagem:");
            if (url) {
                const html = `\n<img src="${url}" class="w-full rounded-xl my-4 shadow-sm">\n`;
                inserirNoCursor('descricao', html);
            }
        };

        window.inserirYoutubeDescricao = () => {
            const url = prompt("Cole o link do vídeo do YouTube:");
            if (url) {
                const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?]+)/);
                if (match && match[1]) {
                    const videoId = match[1];
                    const html = `\n<iframe src="https://www.youtube.com/embed/${videoId}" class="w-full aspect-video rounded-xl my-4 shadow-sm" frameborder="0" allowfullscreen></iframe>\n`;
                    inserirNoCursor('descricao', html);
                } else {
                    alert("Link do YouTube inválido. Tente novamente.");
                }
            }
        };

        window.inserirLinkDescricao = () => {
            const url = prompt("Cole o link (URL):");
            if (url) {
                const texto = prompt("Digite o texto do link:") || "Clique aqui";
                const html = `<a href="${url}" target="_blank" class="text-blue-600 underline hover:text-blue-800">${texto}</a>`;
                inserirNoCursor('descricao', html);
            }
        };

        window.adicionarTopico = () => {
            const id = prompt("Digite um ID único para o novo tópico (letras minúsculas, sem espaços. Ex: vida_noturna):");
            if (!id) return;
            if (capitulosData[id]) {
                alert("Já existe um tópico com este ID. Escolha outro.");
                return;
            }
            const titulo = prompt("Digite o Título do Tópico (ex: Vida Noturna):");
            if (!titulo) return;
            const icone = prompt("Cole o emoji ou ícone do tópico (ex: 🍻):", "📍");
            
            const novaOrdem = Object.values(capitulosData).length > 0 
                ? Math.max(...Object.values(capitulosData).map(c => c.ordem || 0)) + 1 
                : 1;
            
            set(ref(db, `capitulos/${id}`), {
                titulo: titulo,
                icone: icone || "",
                is_separator: false,
                ordem: novaOrdem
            });
        };

        window.editarTopico = (key) => {
            const cap = capitulosData[key];
            const novoTitulo = prompt("Editar Título do Tópico:", cap.titulo);
            if (novoTitulo === null) return;
            
            const novoIcone = prompt("Editar Ícone/Emoji:", cap.icone || "");
            if (novoIcone === null) return;

            update(ref(db, `capitulos/${key}`), {
                titulo: novoTitulo,
                icone: novoIcone
            });
        };

        window.excluirTopicoReal = (key) => {
            if (confirm(`ATENÇÃO: Você está prestes a excluir o tópico "${capitulosData[key]?.titulo}" e TODOS os itens cadastrados dentro dele.\n\nEsta ação não pode ser desfeita. Tem certeza?`)) {
                remove(ref(db, `capitulos/${key}`));
                remove(ref(db, `conteudo/${key}`));
            }
        };

        window.adicionarSeparadorTopico = () => {
            const titulo = prompt("Título do divisor (deixe em branco para ser apenas uma linha):");
            if (titulo !== null) {
                const novaOrdem = Object.values(capitulosData).length > 0 
                    ? Math.max(...Object.values(capitulosData).map(c => c.ordem || 0)) + 1 
                    : 1;
                const id = 'sep_cap_' + Date.now();
                set(ref(db, `capitulos/${id}`), {
                    titulo: titulo,
                    is_separator: true,
                    ordem: novaOrdem
                });
            }
        };

        function renderizarTopicos() {
            const container = document.getElementById('lista-capitulos');
            container.innerHTML = '';
            
            const arr = Object.entries(capitulosData).sort((a, b) => (a[1].ordem||0) - (b[1].ordem||0));
            
            arr.forEach(([key, cap]) => {
                const isActive = key === capituloSelecionado;
                
                if (cap.is_separator) {
                    container.innerHTML += `
                        <div class="flex items-center justify-between p-2 separador cap-item-drag" data-key="${key}">
                            <div class="flex-1 text-[10px] font-bold text-gray-500 uppercase tracking-widest pl-2">${cap.titulo || '--- DIVISOR ---'}</div>
                            <div class="flex space-x-2 items-center">
                                <span class="drag-handle-cap cursor-grab active:cursor-grabbing text-gray-400 hover:text-blue-600 px-1" title="Arraste para reordenar">
                                    ${iconeArrastar}
                                </span>
                                <span class="text-gray-200">|</span>
                                <button onclick="window.excluirTopicoReal('${key}')" class="text-red-400 hover:text-red-600 ml-1 font-bold text-lg leading-none" title="Excluir Divisor">×</button>
                            </div>
                        </div>
                    `;
                } else {
                    container.innerHTML += `
                        <div class="flex items-center justify-between p-3 hover:bg-gray-50 transition cap-item-drag ${isActive ? 'topico-ativo bg-white' : ''}" data-key="${key}">
                            <div class="flex-1 flex items-center cursor-pointer" onclick="window.selecionarTopico('${key}', '${cap.titulo}')">
                                <span class="w-8 text-center text-lg">${cap.icone || ''}</span>
                                <span class="font-medium text-sm ${isActive ? 'text-blue-700' : 'text-gray-700'}">${cap.titulo}</span>
                            </div>
                            <div class="flex space-x-2 items-center">
                                <span class="drag-handle-cap cursor-grab active:cursor-grabbing text-gray-400 hover:text-blue-600 px-1" title="Arraste para reordenar">
                                    ${iconeArrastar}
                                </span>
                                <span class="text-gray-200">|</span>
                                <button onclick="window.editarTopico('${key}')" class="text-blue-400 hover:text-blue-600 text-lg leading-none" title="Editar Tópico">✎</button>
                                <button onclick="window.excluirTopicoReal('${key}')" class="text-red-400 hover:text-red-600 font-bold text-xl leading-none" title="Excluir Tópico">×</button>
                            </div>
                        </div>
                    `;
                }
            });
        }

        window.selecionarTopico = (key, titulo) => {
            capituloSelecionado = key;
            document.getElementById('titulo-tabela').textContent = titulo;
            btnNovoItem.classList.remove('hidden');
            btnDivisorItem.classList.remove('hidden');
            btnAbrirImport.classList.remove('hidden');
            renderizarTopicos(); 
            
            renderizarTabela(); // Renderiza instantaneamente com os dados já cacheados na memória
        };

        window.adicionarSeparadorItem = () => {
            if(!capituloSelecionado) return;
            const titulo = prompt("Título do separador (deixe em branco se quiser apenas uma linha):");
            if (titulo !== null) {
                const itensDoTopico = conteudoData[capituloSelecionado] || {};
                const novaOrdem = Object.values(itensDoTopico).length > 0 
                    ? Math.max(...Object.values(itensDoTopico).map(c => c.ordem || 0)) + 1 
                    : 1;
                const id = 'sep_item_' + Date.now();
                set(ref(db, `conteudo/${capituloSelecionado}/${id}`), {
                    titulo: titulo,
                    is_separator: true,
                    ordem: novaOrdem
                });
            }
        };

        // NOVA LÓGICA DE SALVAMENTO DE ORDEM (DRAG AND DROP)
        window.salvarNovaOrdemItens = () => {
            const rows = document.querySelectorAll('#table-body tr.row-item');
            const updates = {};
            
            rows.forEach((tr, index) => {
                const key = tr.getAttribute('data-key');
                updates[`conteudo/${capituloSelecionado}/${key}/ordem`] = index + 1; // Renumera de 1 a N
            });

            update(ref(db), updates).catch(err => alert("Erro ao reordenar: " + err.message));
        };

        function renderizarTabela() {
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';
            
            const itensDoTopico = conteudoData[capituloSelecionado] || {};
            const arr = Object.entries(itensDoTopico).map(([k, v], i) => ({ key: k, ordem: v.ordem ?? i, ...v })).sort((a, b) => a.ordem - b.ordem);

            if (arr.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="px-4 py-8 text-center text-gray-500">Nenhum item cadastrado.</td></tr>`;
                return;
            }

            let numeroGlobal = 1;

            arr.forEach((item) => {
                const tr = document.createElement('tr');
                tr.setAttribute('data-key', item.key);
                
                const dragHtml = `
                    <div class="drag-handle-item cursor-grab active:cursor-grabbing text-gray-400 hover:text-blue-600 px-2 py-1 mr-2 transition" title="Arraste para reordenar">
                        ${iconeArrastar}
                    </div>
                    <span class="text-gray-200 mx-1">|</span>
                `;
                
                if (item.is_separator) {
                    tr.className = "bg-gray-100 row-item";
                    tr.innerHTML = `
                        <td class="px-3 py-4 text-center"></td>
                        <td class="px-4 py-4 text-sm font-bold text-gray-500 uppercase tracking-widest" colspan="2">
                            --- DIVISOR: ${item.titulo || 'LINHA'} ---
                        </td>
                        <td class="px-4 py-4 text-sm text-right">
                            <div class="flex justify-end items-center space-x-3">
                                ${dragHtml}
                                <button class="text-red-600 hover:text-red-800 font-bold uppercase text-xs" onclick="window.excluirItem('${item.key}')">Excluir</button>
                            </div>
                        </td>
                    `;
                } else {
                    tr.className = "hover:bg-gray-50 transition bg-white row-item";
                    const num = numeroGlobal++;
                    const linkCount = item.links ? Object.values(item.links).length : 0;
                    
                    tr.innerHTML = `
                        <td class="px-3 py-4 text-center font-bold text-gray-400 text-sm">#${num}</td>
                        <td class="px-4 py-4 text-sm font-bold text-gray-900">
                            <div class="flex items-center">
                                ${item.imagem_url ? `<img src="${item.imagem_url}" class="h-8 w-8 rounded object-cover mr-3 border">` : ''}
                                <span class="truncate max-w-xs md:max-w-md">${item.titulo}</span>
                            </div>
                        </td>
                        <td class="px-4 py-4 text-sm text-gray-500">
                            <div class="flex items-center flex-wrap gap-2">
                                ${item.audioguia ? '<span title="Possui Audioguia">🎧</span>' : ''}
                                ${item.passeio_guiado ? '<span title="Passeio Guiado">🗣️</span>' : ''}
                                ${item.valor ? `<span class="bg-gray-100 border px-2 py-0.5 rounded text-xs">${item.valor}</span>` : ''}
                                ${linkCount > 0 ? `<span class="bg-blue-100 text-blue-700 border border-blue-200 px-2 py-0.5 rounded text-xs font-bold">${linkCount} Link(s)</span>` : ''}
                            </div>
                        </td>
                        <td class="px-4 py-4 text-sm text-right">
                            <div class="flex justify-end items-center space-x-3">
                                ${dragHtml}
                                <button class="text-blue-600 hover:text-blue-800 font-bold uppercase text-xs mr-3" onclick="window.editarItem('${item.key}')">Editar</button>
                                <button class="text-red-600 hover:text-red-800 font-bold uppercase text-xs" onclick="window.excluirItem('${item.key}')">Excluir</button>
                            </div>
                        </td>
                    `;
                }
                tableBody.appendChild(tr);
            });
        }

        function preencherSelectTopicos() {
            itemTopicoSelect.innerHTML = '';
            const topicosValidos = Object.entries(capitulosData)
                .filter(([k, v]) => !v.is_separator)
                .sort((a, b) => (a[1].ordem || 0) - (b[1].ordem || 0));
            
            topicosValidos.forEach(([key, cap]) => {
                const opt = document.createElement('option');
                opt.value = key;
                opt.textContent = cap.titulo;
                itemTopicoSelect.appendChild(opt);
            });
        }

        function criarCampoLink(titulo = '', url = '') {
            const div = document.createElement('div');
            div.className = "flex space-x-2 link-item";
            div.innerHTML = `
                <input type="text" placeholder="Nome (ex: Site Oficial)" value="${titulo}" class="w-1/3 border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 link-titulo">
                <input type="url" placeholder="URL (ex: https://...)" value="${url}" class="flex-1 border p-2 rounded text-sm focus:ring-2 focus:ring-blue-500 link-url">
                <button type="button" onclick="this.parentElement.remove()" class="bg-red-100 text-red-600 px-3 py-2 rounded hover:bg-red-200 font-bold text-sm transition">×</button>
            `;
            linksContainer.appendChild(div);
        }

        btnAddLink.addEventListener('click', () => criarCampoLink());

        btnAbrirImport.addEventListener('click', () => {
            modalImport.classList.remove('hidden');
            modalImport.classList.add('flex');
            document.body.style.overflow = 'hidden';
            jsonInput.value = '';
        });

        btnCancelarImport.addEventListener('click', () => {
            modalImport.classList.add('hidden');
            modalImport.classList.remove('flex');
            document.body.style.overflow = '';
        });

        btnConfirmarImport.addEventListener('click', () => {
            try {
                const parsed = JSON.parse(jsonInput.value);
                if(typeof parsed !== 'object' || Array.isArray(parsed)) throw new Error("O JSON deve ser um objeto contendo chaves.");
                
                btnConfirmarImport.textContent = "Processando...";
                btnConfirmarImport.disabled = true;

                const itensDoTopico = conteudoData[capituloSelecionado] || {};
                let maxOrdem = Object.values(itensDoTopico).length > 0 
                    ? Math.max(...Object.values(itensDoTopico).map(i => i.ordem || 0)) 
                    : 0;

                const updates = {};
                for (const [key, item] of Object.entries(parsed)) {
                    maxOrdem++;
                    item.ordem = maxOrdem;
                    item.audioguia = item.audioguia === true;
                    item.passeio_guiado = item.passeio_guiado === true;
                    item.is_separator = item.is_separator === true;
                    updates[`conteudo/${capituloSelecionado}/${key}`] = item;
                }

                update(ref(db), updates).then(() => {
                    modalImport.classList.add('hidden');
                    modalImport.classList.remove('flex');
                    document.body.style.overflow = '';
                    btnConfirmarImport.textContent = "Processar Importação";
                    btnConfirmarImport.disabled = false;
                    alert(`${Object.keys(parsed).length} itens importados com sucesso!`);
                }).catch(err => {
                    alert("Erro ao gravar no banco: " + err.message);
                    btnConfirmarImport.textContent = "Processar Importação";
                    btnConfirmarImport.disabled = false;
                });
                
            } catch (e) {
                alert("JSON Inválido. Verifique as aspas e vírgulas.\nDetalhe: " + e.message);
            }
        });

        function abrirModal(isEdit = false) {
            preencherSelectTopicos(); 
            modalForm.classList.remove('hidden');
            modalForm.classList.add('flex');
            document.body.style.overflow = 'hidden';
            document.getElementById('form-title').textContent = isEdit ? "Editando Item" : "Adicionar Novo Item";
        }

        function fecharModal() {
            modalForm.classList.add('hidden');
            modalForm.classList.remove('flex');
            document.body.style.overflow = '';
            formContent.reset();
            linksContainer.innerHTML = ''; 
            document.getElementById('item-key').disabled = false;
        }

        btnNovoItem.addEventListener('click', () => {
            abrirModal(false);
            itemTopicoSelect.value = capituloSelecionado;

            const itensDoTopico = conteudoData[capituloSelecionado] || {};
            const ultimaOrdem = Object.values(itensDoTopico).length > 0 
                ? Math.max(...Object.values(itensDoTopico).map(i => i.ordem || 0)) 
                : 0;
            document.getElementById('item-ordem').value = ultimaOrdem + 1;
        });
        
        btnCancelar.addEventListener('click', fecharModal);

        formContent.addEventListener('submit', (e) => {
            e.preventDefault();
            const itemKey = document.getElementById('item-key').value;
            const novoCapitulo = itemTopicoSelect.value;
            const btnSubmit = e.target.querySelector('button[type="submit"]');
            const isEdit = document.getElementById('item-key').disabled; 
            
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Salvando...";

            const linkElements = document.querySelectorAll('.link-item');
            const linksData = [];
            linkElements.forEach(el => {
                const t = el.querySelector('.link-titulo').value.trim();
                const u = el.querySelector('.link-url').value.trim();
                if (t && u) linksData.push({ titulo: t, url: u });
            });

            let ordemFinal = parseInt(document.getElementById('item-ordem').value || 0);
            if (novoCapitulo !== capituloSelecionado) {
                const itensDoNovoTopico = conteudoData[novoCapitulo] || {};
                const ultimaOrdemNovo = Object.values(itensDoNovoTopico).length > 0 
                    ? Math.max(...Object.values(itensDoNovoTopico).map(i => i.ordem || 0)) 
                    : 0;
                ordemFinal = ultimaOrdemNovo + 1;
            }

            const data = {
                titulo: document.getElementById('titulo').value,
                descricao: document.getElementById('descricao').value,
                curiosidades: document.getElementById('curiosidades').value,
                funcionamento: document.getElementById('funcionamento').value,
                valor: document.getElementById('valor').value,
                imagem_url: document.getElementById('imagem-url').value,
                audioguia: document.getElementById('audioguia').checked,
                passeio_guiado: document.getElementById('passeio_guiado').checked,
                ordem: ordemFinal,
                is_separator: false,
                links: linksData
            };

            const updates = {};
            updates[`conteudo/${novoCapitulo}/${itemKey}`] = data;

            if (isEdit && novoCapitulo !== capituloSelecionado) {
                updates[`conteudo/${capituloSelecionado}/${itemKey}`] = null;
            }

            update(ref(db), updates).then(() => {
                fecharModal();
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Salvar Item";
            }).catch(err => {
                alert("Erro ao salvar: " + err.message);
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Salvar Item";
            });
        });

        window.editarItem = (itemKey) => {
            abrirModal(true); 
            
            const item = conteudoData[capituloSelecionado][itemKey];
            
            document.getElementById('item-key').value = itemKey;
            document.getElementById('item-key').disabled = true;
            itemTopicoSelect.value = capituloSelecionado;

            document.getElementById('item-ordem').value = item.ordem ?? 0;
            document.getElementById('titulo').value = item.titulo || '';
            document.getElementById('descricao').value = item.descricao || '';
            document.getElementById('curiosidades').value = item.curiosidades || '';
            document.getElementById('funcionamento').value = item.funcionamento || '';
            document.getElementById('valor').value = item.valor || '';
            document.getElementById('imagem-url').value = item.imagem_url || '';
            document.getElementById('audioguia').checked = item.audioguia || false;
            document.getElementById('passeio_guiado').checked = item.passeio_guiado || false;
            
            linksContainer.innerHTML = '';
            if (item.links) {
                const arrLinks = Array.isArray(item.links) ? item.links : Object.values(item.links);
                arrLinks.forEach(l => criarCampoLink(l.titulo, l.url));
            }
        };

        window.excluirItem = (itemKey) => {
            if(confirm("Deseja realmente excluir este item permanentemente?")) {
                remove(ref(db, `conteudo/${capituloSelecionado}/${itemKey}`));
            }
        };
    </script>
</body>
</html>
