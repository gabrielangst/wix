<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Vídeos de Viagens</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 40px;
        }
        h2 {
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
            color: #2980b9;
            margin-top: 40px;
        }
        
        .video-grid {
            display: grid;
            /* AQUI ESTÁ A MÁGICA: mudamos de 280px para 180px */
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px; /* Diminuí um pouco o espaço entre os cards também */
            margin-bottom: 30px;
        }
        
        .video-card {
            background: #fff;
            border-radius: 8px; /* Borda levemente menor */
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }
        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .video-card img {
            width: 100%;
            height: auto;
            display: block;
        }
        .video-title {
            padding: 10px; /* Menos espaçamento interno */
            font-size: 14px; /* Fonte um pouco menor */
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Viagens em Vídeo</h1>

    <!-- 2026 -->

    <div class="video-grid">

        </a>
